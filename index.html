    <script>
        (function() {
            'use strict';

            // ===== 配置 =====
            const CONFIG = {
                MATH_A: 2.0,
                GRID_COLS: 20,
                GRID_ROWS: 10,
                UPDATE_INTERVAL: 80,
                STORAGE_KEY: 'time_app_state_v1',
                HISTORY_KEY: 'logtime_history_v1',
                APPEARANCE_KEY: 'logtime_appearance_v1',
                SUPABASE_URL: 'https://sewtmqnaerfklfhfqtzq.supabase.co',
                SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_63J5MUv_6VXmjwPw6QHPSg_vICgbfmS',
            };

            // ===== Supabase =====
            // SDK 来自 CDN，移动网络下加载失败很常见（超时、被拦、弱网）。
            // 云同步是可选能力，绝不能让它把整个应用拖死：拿不到 SDK 就退化为纯本地模式。
            // 以前的写法是直接 window.supabase.createClient(...)，
            // CDN 一旦失败就会在这里抛错，整个 IIFE 中断 —— init() 和事件绑定都不会执行，
            // 结果是页面完全点不动，连「添加任务」都打不开。
            const supabaseClient = (function() {
                if (!window.supabase || typeof window.supabase.createClient !== 'function') {
                    console.warn('LogTime: Supabase SDK 未加载，已降级为本地模式（计时与历史记录不受影响）');
                    return null;
                }
                try {
                    return window.supabase.createClient(
                        CONFIG.SUPABASE_URL,
                        CONFIG.SUPABASE_PUBLISHABLE_KEY,
                        { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
                    );
                } catch (e) {
                    console.warn('LogTime: Supabase 初始化失败，已降级为本地模式', e);
                    return null;
                }
            })();
            let currentUser = null;
            let cloudHydrated = false;
            let cloudSaveTimer = null;
            let authBusy = false;

            // ===== 状态 =====
            const state = {
                taskName: '',
                totalDuration: 0,
                elapsed: 0,
                isPaused: true,
                isCompleted: false,
                startTimestamp: null,
                accumulatedElapsed: 0,
                pauseTimestamp: null,
                mode: 'ring',
                showRealTime: false,
                isInitialized: false,
                feedbackMode: 'A', // A: 启程, B: 抵达, C: Linear
                isModeLocked: false,
                theme: 'paper', // 画风主题：paper/chunky/flatnight/glass
            };

            // ===== 数学模型 =====
            function calculatePerceivedProgress(x, a) {
                a = a ?? CONFIG.MATH_A;
                if (x <= 0) return 0;
                if (x >= 1) return 1;

                if (state.feedbackMode === 'B') {
                    return x * x;
                }
                if (state.feedbackMode === 'C') {
                    return x;
                }
                // 默认 A：启程
                return Math.log(1 + a * x) / Math.log(1 + a);
            }

            // ===== 主题变量读取 =====
            function cssVar(name) {
                return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
            }

            // 主题色缓存：getComputedStyle 会强制样式重算，不能放在每帧的绘制路径里
            let ringThemeCache = null;
            function ringTheme() {
                if (!ringThemeCache) {
                    ringThemeCache = {
                        track: cssVar('--gray-light'),
                        from: cssVar('--blue'),
                        to: cssVar('--blue-light'),
                    };
                }
                return ringThemeCache;
            }
            // ===== DOM 引用 =====
            const $ = id => document.getElementById(id);
            const dom = {
                app: $('app'),
                taskInfo: $('taskInfo'),
                taskNameDisplay: $('taskNameDisplay'),
                taskNameInput: $('taskNameInput'),
                taskNameWrap: $('taskNameWrap'),
                taskDurationDisplay: $('taskDurationDisplay'),
                menuBtn: $('menuBtn'),
                menuOverlay: $('menuOverlay'),
                menuClose: $('menuClose'),
                addPanel: $('addPanel'),
                addMask: $('addMask'),
                taskNameInputField: $('taskNameInputField'),
                durationInput: $('durationInput'),
                unitSelect: $('unitSelect'),
                cancelAddBtn: $('cancelAddBtn'),
                startNowBtn: $('startNowBtn'),
                emptyState: $('emptyState'),
                emptyAddBtn: $('emptyAddBtn'),
                streetScene: $('streetScene'),
                walker: $('walker'),
                walkerSprite: $('walkerSprite'),
                minimap: $('minimap'),
                miniFill: $('miniFill'),
                doneFlag: $('doneFlag'),
                layerFar: $('layerFar'),
                layerMid: $('layerMid'),
                layerNear: $('layerNear'),
                skyLayer: $('skyLayer'),
                layerClouds: $('layerClouds'),
                layerGround: $('layerGround'),
                sceneSwitchBtn: $('sceneSwitchBtn'),
                themeModal: $('themeModal'),
                themeCloseBtn: $('themeCloseBtn'),

                realTimeToggle: $('realTimeToggle'),
                realTimeDisplay: $('realTimeDisplay'),
                realTimeValue: $('realTimeValue'),
                resetCapsuleBtn: $('resetCapsuleBtn'),
                captureMenuBtn: $('captureMenuBtn'),
                historyMenuBtn: $('historyMenuBtn'),
                resetTaskBtn: $('resetTaskBtn'),
                mainVisual: $('mainVisual'),
                bottomControls: document.querySelector('.bottom-controls'),
                modeSelection: $('modeSelection'),
                modeRadios: document.querySelectorAll('input[name="mode"]'),
                infoBtn: $('infoBtn'),
                infoModal: $('infoModal'),
                infoCloseBtn: $('infoCloseBtn'),
                historyModal: $('historyModal'),
                historyCloseBtn: $('historyCloseBtn'),
                historyList: $('historyList'),
                saveToast: $('saveToast'),
                authBtn: $('authBtn'),
                authModal: $('authModal'),
                authTitle: $('authTitle'),
                authSub: $('authSub'),
                authForm: $('authForm'),
                authAccountView: $('authAccountView'),
                authEmail: $('authEmail'),
                authPassword: $('authPassword'),
                authSubmitBtn: $('authSubmitBtn'),
                authSwitchBtn: $('authSwitchBtn'),
                authStatus: $('authStatus'),
                authAccountEmail: $('authAccountEmail'),
                authSignOutBtn: $('authSignOutBtn'),
                authCloseBtn: $('authCloseBtn'),
                authGuestCloseWrap: $('authGuestCloseWrap'),
                authGuestCloseBtn: $('authGuestCloseBtn'),
            };

            // ===== 显示保存提示（右下角淡入淡出） =====
            let toastTimer = null;

            function showSaveToast() {
                const el = dom.saveToast;
                // 重置动画
                if (toastTimer) {
                    clearTimeout(toastTimer);
                    toastTimer = null;
                }
                el.classList.remove('visible');
                // 强制回流后显示
                void el.offsetWidth;
                el.classList.add('visible');
                // 3.5秒后淡出
                toastTimer = setTimeout(function() {
                    el.classList.remove('visible');
                    toastTimer = null;
                }, 3500);
            }

            // ===== 历史记录 =====
            function getHistory() {
                try {
                    const raw = localStorage.getItem(CONFIG.HISTORY_KEY);
                    if (!raw) return [];
                    const data = JSON.parse(raw);
                    return Array.isArray(data) ? data : [];
                } catch (e) { return []; }
            }

            async function loadCloudHistory() {
                if (!currentUser || !supabaseClient) return;
                const { data, error } = await supabaseClient
                    .from('logtime_history')
                    .select('id, task_name, total_duration, elapsed, feedback_mode, display_mode, completed_at')
                    .eq('user_id', currentUser.id)
                    .order('completed_at', { ascending: true })
                    .limit(500);
                if (error) { console.warn('LogTime cloud history:', error.message); return; }
                const history = (data || []).map(item => ({
                    id: item.id,
                    taskName: item.task_name || '未命名任务',
                    totalDuration: item.total_duration || 0,
                    elapsed: item.elapsed || 0,
                    feedbackMode: item.feedback_mode || 'A',
                    mode: item.display_mode || 'ring',
                    completedAt: item.completed_at
                }));
                localStorage.setItem(CONFIG.HISTORY_KEY, JSON.stringify(history));
                renderHistory();
            }

            async function saveHistoryEntry(entry) {
                const item = {
                    ...entry,
                    id: (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '_' + Math.random().toString(36).slice(2, 10)),
                    completedAt: new Date().toISOString()
                };
                try {
                    const history = getHistory();
                    history.push(item);
                    if (history.length > 500) history.splice(0, history.length - 500);
                    localStorage.setItem(CONFIG.HISTORY_KEY, JSON.stringify(history));
                    showSaveToast();

                    if (currentUser && supabaseClient) {
                        const { error } = await supabaseClient.from('logtime_history').insert({
                            id: item.id,
                            user_id: currentUser.id,
                            task_name: item.taskName,
                            total_duration: item.totalDuration || state.totalDuration,
                            elapsed: item.elapsed || state.elapsed,
                            feedback_mode: item.feedbackMode || state.feedbackMode,
                            display_mode: item.mode || state.mode,
                            completed_at: item.completedAt
                        });
                        if (error) console.warn('LogTime history sync:', error.message);
                    }
                } catch (e) { console.warn('History save failed:', e); }
            }

            async function deleteHistoryItem(id) {
                try {
                    const history = getHistory().filter(item => item.id !== id);
                    localStorage.setItem(CONFIG.HISTORY_KEY, JSON.stringify(history));
                    renderHistory();
                    if (currentUser && supabaseClient) {
                        const { error } = await supabaseClient.from('logtime_history').delete().eq('id', id).eq('user_id', currentUser.id);
                        if (error) console.warn('LogTime history delete:', error.message);
                    }
                } catch (e) { /* ignore */ }
            }

            function renderHistory() {
                const history = getHistory();
                const list = dom.historyList;
                if (history.length === 0) {
                    list.innerHTML = '<div class="history-empty">暂无记录</div>';
                    return;
                }
                const sorted = [...history].reverse();
                let html = '';
                sorted.forEach(function(item) {
                    const dateStr = item.completedAt ? new Date(item.completedAt).toLocaleString('zh-CN', {
                        month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
                    }) : '—';
                    const name = item.taskName || '未命名任务';
                    const duration = formatDuration(item.elapsed || item.totalDuration || 0);
                    html += `
                        <div class="history-item" data-id="${item.id}">
                            <div class="h-left">
                                <div class="h-name">${name}</div>
                                <div class="h-time">${dateStr}</div>
                                <div class="h-duration">本次时长 · ${duration}</div>
                            </div>
                            <button class="h-del" data-id="${item.id}" aria-label="删除">✕</button>
                        </div>`;
                });
                list.innerHTML = html;
                list.querySelectorAll('.h-del').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        if (confirm('确定要删除这条记录吗？')) deleteHistoryItem(id);
                    });
                });
            }

            // ===== 任务名称编辑 =====
            let isEditing = false;

            function enableTaskNameEdit() {
                if (state.totalDuration <= 0) return;
                if (isEditing) return;

                isEditing = true;
                dom.taskNameInput.value = state.taskName || '';
                dom.taskNameDisplay.classList.add('hidden');
                dom.taskNameInput.classList.remove('hidden');
                dom.taskNameInput.focus();

                var len = dom.taskNameInput.value.length;
                dom.taskNameInput.setSelectionRange(len, len);
            }

            function disableTaskNameEdit(save) {
                if (!isEditing) return;
                isEditing = false;

                dom.taskNameInput.classList.add('hidden');
                dom.taskNameDisplay.classList.remove('hidden');

                if (save !== false) {
                    const newName = dom.taskNameInput.value.trim() || '未命名任务';
                    state.taskName = newName;
                    updateTaskInfoDisplay();
                    saveState();
                } else {
                    updateTaskInfoDisplay();
                }
            }

            // ===== 素材资产：内嵌 base64 分层贴图 =====
            const ASSETS = (function() {
                try {
                    const el = document.getElementById('assetsJson');
                    return el ? JSON.parse(el.textContent) : null;
                } catch (e) { return null; }
            })();

            // ===== 街景系统（treadmill：角色固定，世界向左经过） =====
            // 层速度沿用素材 layers.json：clouds 0.08 / far 0.2 / mid 0.4 / near 0.65 / ground 1.0
            const STREET = {
                offsets: { far: 0, mid: 0, near: 0, clouds: 0, ground: 0 },
                lastT: 0,
                raf: 0,
                running: false,
            };
            const SPEED_BASE = 55;          // 近景基准速度 px/s
            const SPEED_IDLE = 0.45;        // 空态闲逛系数
            const LAYER_RATIO = {
                far: 0.20 / 0.65,
                mid: 0.40 / 0.65,
                near: 1.0,
                clouds: 0.08 / 0.65,
                ground: 1.0,
            };

            // ===== 主题系统：5 风格 × 素材场景（直接贴素材分层图） =====
            const THEMES = {
                paper:     { label: '纸张清昼', tag: 'PAPER',  scene: '海洋', groundH: 40, layers: ASSETS.paper },
                chunky:    { label: '软糖暖昼', tag: 'CHUNKY', scene: '森林', groundH: 15, layers: ASSETS.chunky },
                flatnight: { label: '扁平星夜', tag: 'NIGHT',  scene: '沙漠', groundH: 13, layers: ASSETS.flatnight },
                glass:     { label: '玻璃暮夜', tag: 'GLASS',  scene: '城市', groundH: 20, layers: ASSETS.glass },
            };
            const THEME_ORDER = ['paper', 'chunky', 'flatnight', 'glass'];

            // 切换画风主题：六层贴图 + 站立基准线 + 面板配色 + 持久化
            function applyTheme(name) {
                if (!THEMES[name]) name = 'paper';
                state.theme = name;
                const t = THEMES[name];
                if (t && t.layers) {
                    const set = function(id, key) {
                        const el = document.getElementById(id);
                        if (el) el.style.backgroundImage = 'url(' + t.layers[key] + ')';
                    };
                    set('skyLayer', 'sky');
                    set('layerClouds', 'clouds');
                    set('layerFar', 'far');
                    set('layerMid', 'mid');
                    set('layerNear', 'near');
                    set('layerGround', 'ground');
                }
                document.documentElement.setAttribute('data-theme', name);
                document.documentElement.style.setProperty('--road-h', t.groundH + '%');
                updateThemePickerState();
                saveState();
            }

            function updateThemePickerState() {
                if (!dom.themeModal) return;
                dom.themeModal.querySelectorAll('.theme-card').forEach(function(c) {
                    c.classList.toggle('active', c.getAttribute('data-key') === state.theme);
                });
            }

            function currentSpeedFactor() {
                if (state.isCompleted) return 0;
                if (state.totalDuration <= 0) return SPEED_IDLE;
                if (state.isPaused) return 0;
                const x = Math.min(state.elapsed / state.totalDuration, 1);
                const a = CONFIG.MATH_A;
                if (state.feedbackMode === 'B') return Math.min(2 * x, 2.2); // 抵达：先慢后快
                if (state.feedbackMode === 'C') return 1;                    // 恒行：匀速
                return 2 / ((1 + a * x) * Math.log(1 + a));                  // 启程：先快后慢
            }

            function setLayerOffset(id, off) {
                const el = document.getElementById(id);
                if (el) el.style.backgroundPosition = (-off) + 'px 0';
            }

            function updateStreet(dt) {
                const f = currentSpeedFactor();
                const near = SPEED_BASE * f;
                const mid = near * LAYER_RATIO.mid;
                const far = near * LAYER_RATIO.far;
                const clouds = near * LAYER_RATIO.clouds;
                STREET.offsets.near += near * dt;
                STREET.offsets.mid += mid * dt;
                STREET.offsets.far += far * dt;
                STREET.offsets.clouds += clouds * dt;
                STREET.offsets.ground += near * dt;
                setLayerOffset('layerNear', STREET.offsets.near);
                setLayerOffset('layerMid', STREET.offsets.mid);
                setLayerOffset('layerFar', STREET.offsets.far);
                setLayerOffset('layerClouds', STREET.offsets.clouds);
                setLayerOffset('layerGround', STREET.offsets.ground);
                updateWalkCycle(f);
            }

            function updateWalkCycle(f) {
                const walker = dom.walker;
                if (!walker) return;
                const moving = f > 0.02;
                walker.querySelectorAll('.sprite, .ride').forEach(function(s) {
                    const dur = Math.max(0.28, Math.min(1.3, 1 / Math.max(f, 0.25)));
                    s.style.setProperty('--walk-dur', dur + 's');
                    s.classList.toggle('walking', moving);
                    s.classList.toggle('stopped', !moving);
                });
            }

            function updateMinimap(x, p) {
                if (!dom.minimap || !dom.miniFill) return;
                const hasTask = state.totalDuration > 0;
                if (hasTask && dom.minimap.classList.contains('hidden')) dom.minimap.classList.remove('hidden');
                if (!hasTask && !dom.minimap.classList.contains('hidden')) dom.minimap.classList.add('hidden');
                if (hasTask) {
                    // 右上角进度条展示映射（感知）进度；真实进度保留在右下角（默认隐藏）
                    const t = Math.min(Math.max(p, 0), 1);
                    dom.miniFill.style.width = (t * 100).toFixed(2) + '%';
                    dom.miniFill.classList.toggle('done', !!state.isCompleted);
                }
            }

            function showMinimap(show) {
                if (dom.minimap) dom.minimap.classList.toggle('hidden', !show);
            }

            function showDoneFlag() {
                if (dom.doneFlag) dom.doneFlag.classList.remove('hidden');
            }

            function hideDoneFlag() {
                if (dom.doneFlag) dom.doneFlag.classList.add('hidden');
            }

            function streetLoop(t) {
                if (!STREET.running) return;
                if (!STREET.lastT) STREET.lastT = t;
                const dt = Math.min((t - STREET.lastT) / 1000, 0.1);
                STREET.lastT = t;
                updateStreet(dt);
                STREET.raf = requestAnimationFrame(streetLoop);
            }

            function startStreetLoop() {
                if (STREET.running) return;
                STREET.running = true;
                STREET.lastT = 0;
                STREET.raf = requestAnimationFrame(streetLoop);
            }

            function stopStreetLoop() {
                STREET.running = false;
                if (STREET.raf) cancelAnimationFrame(STREET.raf);
                STREET.raf = 0;
            }
            // ===== 核心更新 =====
            let updateTimer = null;
            let isUpdating = false;

            function updateTime() {
                if (isUpdating) return;
                isUpdating = true;
                try {
                    if (!state.isCompleted && !state.isPaused && state.startTimestamp !== null) {
                        const now = Date.now();
                        const delta = (now - state.startTimestamp) / 1000;
                        const newElapsed = state.accumulatedElapsed + delta;
                        if (newElapsed >= state.totalDuration) {
                            state.elapsed = state.totalDuration;
                            state.isCompleted = true;
                            state.isPaused = true;
                            state.startTimestamp = null;
                            onComplete();
                        } else {
                            state.elapsed = newElapsed;
                        }
                    }

                    const x = state.totalDuration > 0 ? Math.min(state.elapsed / state.totalDuration, 1) : 0;
                    const p = calculatePerceivedProgress(x);
                    renderAll(x, p);

                    if (state.isCompleted && updateTimer) {
                        clearInterval(updateTimer);
                        updateTimer = null;
                    }
                } catch (e) { console.warn(e); } finally { isUpdating = false; }
            }

            function formatPercent(v) {
                v = Math.min(Math.max(v, 0), 1);
                return (v * 100).toFixed(1) + '%';
            }

            function renderAll(x, p) {
                updateStreet(0.02);
                updateMinimap(x, p);
                dom.realTimeValue.textContent = state.totalDuration > 0 ? Math.round(x * 100) + '%' : '';
                updateTaskInfoDisplay();
                updatePauseButton();
                updateRealTimeVisibility();
                updatePauseVisual();
                updateBottomControls();
            }
            // ===== 到点提醒（系统通知 + 提示音 + 震动）=====
            // 计时器最核心的承诺：到点了必须能提醒你 —— 哪怕你已经切去别的应用。
            // 三件事各有分工：
            //   系统通知：页面在后台时的主力（手机必须走 Service Worker，桌面可直接 new Notification）
            //   提示音  ：前后台都有效，用 Web Audio 实时合成，不依赖任何音频文件
            //   震动    ：安卓的兜底
            // 授权只在"开始任务"这个用户手势里申请一次（浏览器要求手势），
            // 被拒绝或已拒绝过就不再打扰，声音和震动照常工作。
            const NOTIFY_ASKED_KEY = 'logtime_notify_asked';
            let audioCtx = null;
            let swRegistration = null;

            // 在用户手势里初始化音频上下文：等到计时结束才创建会被自动播放策略拦下
            function primeAudio() {
                try {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (!AC) return;
                    if (!audioCtx) audioCtx = new AC();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                } catch (e) { /* 音频不可用不影响计时 */ }
            }

            function playChime() {
                try {
                    primeAudio();
                    if (!audioCtx) return;
                    const t0 = audioCtx.currentTime + 0.01;
                    [[880, 0], [1318.5, 0.16]].forEach(function (pair) {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = pair[0];
                        const t = t0 + pair[1];
                        gain.gain.setValueAtTime(0.0001, t);
                        gain.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(t);
                        osc.stop(t + 0.55);
                    });
                } catch (e) { /* ignore */ }
            }

            function notificationReady() {
                return typeof Notification !== 'undefined' && Notification.permission === 'granted';
            }

            function ensureNotifyPermission() {
                try {
                    if (typeof Notification === 'undefined') return;
                    if (Notification.permission !== 'default') return;
                    // 问过一次就不再弹，避免每次点开始都打扰
                    if (localStorage.getItem(NOTIFY_ASKED_KEY) === '1') return;
                    localStorage.setItem(NOTIFY_ASKED_KEY, '1');
                    Notification.requestPermission();
                } catch (e) { /* ignore */ }
            }

            function registerServiceWorker() {
                if (!('serviceWorker' in navigator)) return;
                // SW 只在安全上下文可用；file:// 下注册会失败，那就退化成桌面通知
                if (location.protocol !== 'https:' && location.hostname !== 'localhost' &&
                    location.hostname !== '127.0.0.1') return;
                navigator.serviceWorker.register('./sw.js').then(function (reg) {
                    swRegistration = reg;
                }).catch(function () { /* 没有 SW 也能用桌面通知 */ });
            }

            function notifyComplete(title, body) {
                if (!notificationReady()) return;
                const opts = {
                    body: body,
                    icon: './icon-192.png',
                    badge: './favicon-32x32.png',
                    tag: 'logtime-done',
                    renotify: true,
                };
                try {
                    const reg = swRegistration ||
                        (navigator.serviceWorker && navigator.serviceWorker.controller);
                    if (reg && typeof reg.showNotification === 'function') {
                        reg.showNotification(title, opts);   // 移动端必须走这条
                    } else {
                        const n = new Notification(title, opts);   // 桌面端
                        n.onclick = function () { try { window.focus(); } catch (e) {} n.close(); };
                    }
                } catch (e) { /* 通知失败不影响计时 */ }
            }

            // 到点提醒的统一入口：看得见屏幕时应用内已有庆祝动画，就只出声；
            // 切到后台了才发系统通知。
            function alertCompletion() {
                playChime();
                try { if (navigator.vibrate) navigator.vibrate([90, 60, 160]); } catch (e) {}
                if (document.visibilityState !== 'visible') {
                    notifyComplete('LogTime · 时间到',
                        (state.taskName.trim() || '未命名任务') + ' 已完成');
                }
            }

            // ===== 屏幕常亮（Screen Wake Lock）=====
            // 计时过程中不允许系统息屏 —— 计时器类应用的基本预期。
            // 三个必须处理的细节：
            //   ① 需要安全上下文（https / localhost），不支持时静默降级，绝不影响计时
            //   ② 页面切到后台时浏览器会自行释放锁，回到前台必须重新申请
            //   ③ 不在计时就主动释放，否则白耗电
            let wakeLock = null;
            let wakeLockWanted = false;

            function updateWakeLock() {
                // 只在"任务正在进行"时保持常亮：没有任务、已暂停、已完成都释放
                wakeLockWanted = state.totalDuration > 0 && !state.isPaused && !state.isCompleted;
                if (wakeLockWanted) requestWakeLock();
                else releaseWakeLock();
            }
            function requestWakeLock() {
                if (wakeLock) return;
                if (!navigator.wakeLock || typeof navigator.wakeLock.request !== 'function') return;
                if (document.visibilityState !== 'visible') return;
                navigator.wakeLock.request('screen').then(function(sentinel) {
                    // 申请期间状态可能已经变了（例如已经暂停），那就立刻还回去
                    if (!wakeLockWanted) {
                        try { sentinel.release(); } catch (e) {}
                        return;
                    }
                    wakeLock = sentinel;
                    sentinel.addEventListener('release', function() {
                        // 切后台时系统会自行释放，这里同步状态
                        wakeLock = null;
                    });
                }).catch(function(e) {
                    wakeLock = null;
                    console.warn('LogTime: 屏幕常亮申请失败（不影响计时）', e && e.message);
                });
            }
            function releaseWakeLock() {
                if (!wakeLock) return;
                try { wakeLock.release(); } catch (e) { /* ignore */ }
                wakeLock = null;
            }

            function updateBottomControls() {
                const shouldShow = state.totalDuration > 0;
                if (dom.bottomControls.classList.contains('bar-hidden') === shouldShow) {
                    dom.bottomControls.classList.toggle('bar-hidden', !shouldShow);
                    // 工具栏通栏悬浮在底部，出现时正文列要给它让出高度
                    dom.app.classList.toggle('has-bottom-bar', shouldShow);
                }
                // 放在守卫之外：这一条要跟着状态走，且必须每条状态切换路径都覆盖到
                updateWakeLock();
            }

            function formatDuration(s) {
                if (s <= 0) return '—';
                const mins = s / 60;
                const hours = mins / 60;
                const days = hours / 24;
                const weeks = days / 7;
                if (weeks >= 1 && Number.isInteger(weeks)) return weeks + ' 周';
                if (days >= 1 && Number.isInteger(days)) return days + ' 天';
                if (hours >= 1 && Number.isInteger(hours)) return hours + ' 小时';
                if (mins >= 1 && Number.isInteger(mins)) return mins + ' 分钟';
                return Math.round(s) + ' 秒';
            }

            // 未开始任务（添加任务界面）时隐藏左上角占位；任务进行中照常显示
            function setTaskInfoVisible(visible) {
                if (dom.taskInfo.classList.contains('is-empty') !== !visible) {
                    dom.taskInfo.classList.toggle('is-empty', !visible);
                }
            }

            function setText(el, text) {
                if (el.textContent !== text) el.textContent = text;
            }

            function resetTaskInfoDisplay() {
                setText(dom.taskNameDisplay, '');
                setText(dom.taskDurationDisplay, '');
                if (!dom.taskNameDisplay.classList.contains('empty')) dom.taskNameDisplay.classList.add('empty');
                setTaskInfoVisible(false);
            }

            function updateTaskInfoDisplay() {
                const hasTask = state.totalDuration > 0;
                setTaskInfoVisible(hasTask);
                if (!hasTask) {
                    resetTaskInfoDisplay();
                    return;
                }

                if (isEditing) {
                    setText(dom.taskDurationDisplay, formatDuration(state.totalDuration));
                    return;
                }
                const raw = state.taskName.trim();
                setText(dom.taskNameDisplay, raw || '未命名任务');
                if (dom.taskNameDisplay.classList.contains('empty') !== !raw) {
                    dom.taskNameDisplay.classList.toggle('empty', !raw);
                }
                setText(dom.taskDurationDisplay, formatDuration(state.totalDuration));
            }

            function updatePauseButton() {
                // 暂停/继续入口已移除；仅完成态显示"重置"胶囊
                const want = state.isCompleted ? '' : 'none';
                if (dom.resetCapsuleBtn.style.display !== want) dom.resetCapsuleBtn.style.display = want;
            }

            function updatePauseVisual() {
                const want = !state.isCompleted && state.isPaused;
                if (dom.mainVisual.classList.contains('paused-state') !== want) {
                    dom.mainVisual.classList.toggle('paused-state', want);
                }
            }

            function updateRealTimeVisibility() {
                const want = !!state.showRealTime;
                if (dom.realTimeDisplay.classList.contains('visible') !== want) {
                    dom.realTimeDisplay.classList.toggle('visible', want);
                }
            }

            // ===== 模式徽标（左下角） =====
            const MODE_NAMES = { A: '启程', B: '抵达', C: '恒行' };
            function updateModeBadge() {
                const btn = document.getElementById('modeBadgeBtn');
                if (!btn) return;
                const letter = btn.querySelector('.badge-letter');
                const name = btn.querySelector('.badge-name');
                if (letter) letter.textContent = state.feedbackMode;
                if (name) name.textContent = MODE_NAMES[state.feedbackMode] || '启程';
            }
            // ===== 暂停/继续 =====
            function togglePause() {
                if (state.isCompleted) { resetTask(); return; }
                if (state.totalDuration <= 0) return;

                if (state.isPaused) {
                    state.isPaused = false;
                    state.startTimestamp = Date.now();
                    state.pauseTimestamp = null;
                    startTimer();
                } else {
                    state.isPaused = true;
                    if (state.startTimestamp !== null) {
                        const now = Date.now();
                        state.accumulatedElapsed += (now - state.startTimestamp) / 1000;
                        state.elapsed = state.accumulatedElapsed;
                        state.startTimestamp = null;
                    }
                    state.pauseTimestamp = Date.now();
                    if (updateTimer) { clearInterval(updateTimer);
                        updateTimer = null; }
                    const x = state.totalDuration > 0 ? Math.min(state.elapsed / state.totalDuration, 1) : 0;
                    const p = calculatePerceivedProgress(x);
                    renderAll(x, p);
                }
                updatePauseButton();
                updatePauseVisual();
                saveState();
            }

            function startTimer() {
                if (updateTimer) clearInterval(updateTimer);
                if (state.isPaused || state.isCompleted) return;
                if (!state.startTimestamp) state.startTimestamp = Date.now();
                updateTimer = setInterval(updateTime, CONFIG.UPDATE_INTERVAL);
                updateTime();
            }

            // ===== 完成 =====
            let burstTimeout = null;

            function triggerCelebrationBurst() {
                document.querySelectorAll('.completion-burst').forEach(el => el.remove());
                if (burstTimeout) clearTimeout(burstTimeout);
                const burst = document.createElement('div');
                burst.className = 'completion-burst';
                const colors = ['#f58fb5', '#ffd23f', '#3b82d8', '#4c9a5a', '#c96f5a', '#ffffff', '#e8c88f', '#2a63b0'];
                for (let i = 0; i < 8; i++) {
                    const piece = document.createElement('div');
                    piece.className = 'burst-piece';
                    piece.style.background = colors[i % colors.length];
                    const ang = (i / 8) * Math.PI * 2;
                    const dist = 72 + (i % 3) * 26;
                    piece.style.setProperty('--dx', Math.round(Math.cos(ang) * dist) + 'px');
                    piece.style.setProperty('--dy', Math.round(Math.sin(ang) * dist - 42) + 'px');
                    piece.style.setProperty('--burst-dur', (0.7 + (i % 4) * 0.12) + 's');
                    burst.appendChild(piece);
                }
                document.body.appendChild(burst);
                burstTimeout = setTimeout(function() {
                    document.querySelectorAll('.completion-burst').forEach(el => el.remove());
                }, 1600);
                if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
            }
            function onComplete() {
                // 先保存历史记录
                if (state.totalDuration >= 60) {
                    const entry = {
                        taskName: state.taskName.trim() || '未命名任务',
                        totalDuration: state.totalDuration,
                        elapsed: state.totalDuration,
                        feedbackMode: state.feedbackMode,
                        mode: state.mode,
                    };
                    saveHistoryEntry(entry);
                }

                // 完成反馈（涟漪光晕）
                triggerCelebrationBurst();

                // 到点提醒：提示音 + 震动，切到后台时补一条系统通知
                alertCompletion();

                state.isCompleted = true;
                state.isPaused = true;
                state.elapsed = state.totalDuration;
                state.startTimestamp = null;
                if (updateTimer) { clearInterval(updateTimer);
                    updateTimer = null; }

                const x = 1;
                const p = calculatePerceivedProgress(1);
                renderAll(x, p);
                showDoneFlag();

                updatePauseButton();
                updatePauseVisual();
                saveState();
            }
            // ===== 角色比例适配：随场景宽度缩放，保证手机/桌面视觉比例一致 =====
            function fitCharacter() {
                const scene = document.getElementById('streetScene');
                const walker = document.getElementById('walker');
                if (!scene || !walker) return;
                const s = Math.max(0.8, Math.min(3.2, Math.round(scene.clientWidth / 390 * 10) / 10));
                walker.style.zoom = s;
            }

            // ===== 添加任务 =====
            function openAddPanel() {
                dom.addPanel.classList.add('open');
                if (dom.addMask) dom.addMask.classList.add('open');
                dom.emptyState.classList.add('hidden');
                dom.taskNameInputField.value = state.taskName || '';
                dom.taskNameInputField.focus();
                dom.taskNameInputField.select();

                updateModeSelector();

                if (state.totalDuration > 0) {
                    const s = state.totalDuration;
                    if (s % 86400 === 0 && s >= 86400) { dom.durationInput.value = s / 86400;
                        dom.unitSelect.value = 'days'; } else if (s % 3600 === 0 && s >= 3600) { dom.durationInput.value =
                            s / 3600;
                        dom.unitSelect.value = 'hours'; } else if (s % 60 === 0 && s >= 60) { dom.durationInput.value = s /
                            60;
                        dom.unitSelect.value = 'minutes'; } else { dom.durationInput.value = s;
                        dom.unitSelect.value = 'minutes'; }
                } else {
                    dom.durationInput.value = 1;
                    dom.unitSelect.value = 'hours';
                }
            }

            function updateModeSelector() {
                const isLocked = state.isModeLocked;
                dom.modeSelection.classList.toggle('disabled', isLocked);
                dom.modeRadios.forEach(radio => {
                    radio.checked = (radio.value === state.feedbackMode);
                    radio.disabled = isLocked;
                });
                updateModeCards();
            }

            // 关于弹窗里三张卡片：选中的那个整条亮起来（汉字名 + 字母徽标一起）
            function updateModeCards() {
                document.querySelectorAll('.mode-card[data-feedback-mode]').forEach(function(el) {
                    el.classList.toggle('active', el.dataset.feedbackMode === state.feedbackMode);
                });
            }

            function closeAddPanel() {
                dom.addPanel.classList.remove('open');
                if (dom.addMask) dom.addMask.classList.remove('open');
                if (state.totalDuration <= 0) dom.emptyState.classList.remove('hidden');
            }

            function startNewTask() {
                const name = dom.taskNameInputField.value.trim() || '未命名任务';
                const num = parseFloat(dom.durationInput.value);
                const unit = dom.unitSelect.value;

                if (isNaN(num) || num <= 0) {
                    dom.durationInput.style.borderColor = '#c0392b';
                    setTimeout(() => dom.durationInput.style.borderColor = '', 800);
                    return;
                }

                let seconds = 0;
                switch (unit) {
                    case 'minutes':
                        seconds = num * 60;
                        break;
                    case 'hours':
                        seconds = num * 3600;
                        break;
                    case 'days':
                        seconds = num * 86400;
                        break;
                    case 'weeks':
                        seconds = num * 604800;
                        break;
                    default:
                        seconds = num * 3600;
                }

                if (seconds <= 0) {
                    dom.durationInput.style.borderColor = '#c0392b';
                    setTimeout(() => dom.durationInput.style.borderColor = '', 800);
                    return;
                }

                const selectedMode = document.querySelector('input[name="mode"]:checked');
                if (selectedMode) {
                    state.feedbackMode = selectedMode.value;
                } else {
                    state.feedbackMode = 'A';
                }
                updateModeCards();

                state.isModeLocked = true;

                resetState();

                state.taskName = name;
                state.totalDuration = seconds;
                state.elapsed = 0;
                state.accumulatedElapsed = 0;
                state.isPaused = false;
                state.isCompleted = false;
                state.startTimestamp = Date.now();
                state.pauseTimestamp = null;

                dom.emptyState.classList.add('hidden');
                showMinimap(true);
                updateMinimap(0, 0);

                updateTaskInfoDisplay();
                closeAddPanel();
                // 借这次用户手势：初始化音频上下文、申请通知授权
                primeAudio();
                ensureNotifyPermission();
                startTimer();
                saveState();
                forgetHeroRectSoon();
            }

            function resetState() {
                if (updateTimer) { clearInterval(updateTimer);
                    updateTimer = null; }
                state.isCompleted = false;
                state.isPaused = true;
                state.elapsed = 0;
                state.accumulatedElapsed = 0;
                state.startTimestamp = null;
                state.pauseTimestamp = null;
                dom.mainVisual.classList.remove('paused-state');
            }

            // ===== 图片生成（像素街景卡片） =====
            async function generateCapture() {
                if (typeof html2canvas === 'undefined') { alert('图片库未加载'); return; }
                const btn = dom.captureMenuBtn;
                const orig = btn.innerHTML;
                btn.innerHTML = '生成中…';
                btn.style.pointerEvents = 'none';
                try {
                    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
                    document.body.classList.add('capture-mode');
                    const wrap = document.createElement('div');
                    wrap.style.cssText = 'position:fixed;left:-9999px;top:0;width:560px;z-index:-1;';
                    const tname = state.taskName.trim() || '未命名任务';
                    const dur = state.totalDuration > 0 ? formatDuration(state.totalDuration) : '—';
                    const x = state.totalDuration > 0 ? Math.min(state.elapsed / state.totalDuration, 1) : 0;
                    const pct = state.totalDuration > 0 ? Math.round(x * 100) + '%' : '—';
                    const modeName = MODE_NAMES[state.feedbackMode] || '启程';
                    const clone = dom.streetScene.cloneNode(true);
                    const sp = clone.querySelector('.sprite');
                    if (sp) { sp.classList.remove('walking'); sp.classList.add('stopped'); }
                    const sceneHost = document.createElement('div');
                    sceneHost.className = 'share-scene';
                    sceneHost.appendChild(clone);
                    wrap.appendChild(sceneHost);
                    const info = document.createElement('div');
                    info.className = 'share-info';
                    info.innerHTML = '<div><div class="si-name"></div><div class="si-sub"></div></div><div class="si-pct"></div>';
                    info.querySelector('.si-name').textContent = tname;
                    info.querySelector('.si-sub').textContent = dur + ' · ' + modeName + (state.isCompleted ? ' · 已完成' : '');
                    info.querySelector('.si-pct').textContent = pct;
                    wrap.appendChild(info);
                    const footer = document.createElement('div');
                    footer.className = 'share-footer';
                    footer.textContent = 'LogTime v2.0';
                    wrap.appendChild(footer);
                    document.body.appendChild(wrap);
                    await new Promise(res => setTimeout(res, 80));
                    const canvas = await html2canvas(wrap, { scale: 2, useCORS: true, backgroundColor: '#8ecbf5', logging: false });
                    document.body.removeChild(wrap);
                    document.body.classList.remove('capture-mode');

                    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
                    const fileName = 'LogTime_' + (tname || 'task') + '_' + new Date().toISOString().slice(0, 10) + '.png';
                    const file = new File([blob], fileName, { type: 'image/png' });

                    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
                    if (isIOS && navigator.share) {
                        try { await navigator.share({ files: [file], title: fileName }); } catch (e) {}
                    } else {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fileName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }
                } catch (err) {
                    console.error(err);
                    alert('生成图片失败，请重试');
                } finally {
                    btn.innerHTML = orig;
                    btn.style.pointerEvents = '';
                    document.body.classList.remove('capture-mode');
                }
            }
            // ===== 存储 =====
            function getSerializableState() {
                return {
                    taskName: state.taskName,
                    totalDuration: state.totalDuration,
                    elapsed: state.elapsed,
                    accumulatedElapsed: state.accumulatedElapsed,
                    isPaused: state.isPaused,
                    isCompleted: state.isCompleted,
                    mode: state.mode,
                    showRealTime: state.showRealTime,
                    feedbackMode: state.feedbackMode,
                    isModeLocked: state.isModeLocked,
                    theme: state.theme,
                    version: 2,
                };
            }

            function saveState() {
                const d = getSerializableState();
                try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(d)); } catch (e) { /* ignore */ }
                if (currentUser && cloudHydrated) {
                    clearTimeout(cloudSaveTimer);
                    cloudSaveTimer = setTimeout(() => saveCloudState(d), 900);
                }
            }

            async function saveCloudState(d) {
                if (!currentUser || !cloudHydrated || !supabaseClient) return;
                const { error } = await supabaseClient.from('logtime_state').upsert({
                    user_id: currentUser.id,
                    state: d,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'user_id' });
                if (error) console.warn('LogTime state sync:', error.message);
            }

            function applyState(d) {
                if (!d || typeof d !== 'object') return false;
                state.taskName = d.taskName || '';
                state.totalDuration = d.totalDuration || 0;
                state.elapsed = d.elapsed || 0;
                state.accumulatedElapsed = d.accumulatedElapsed || 0;
                state.isPaused = d.isPaused !== undefined ? d.isPaused : true;
                state.isCompleted = d.isCompleted || false;
                state.mode = 'street';
                state.showRealTime = d.showRealTime || false;
                state.feedbackMode = d.feedbackMode || 'A';
                state.isModeLocked = d.isModeLocked || false;
                state.theme = (d.theme && THEMES[d.theme]) ? d.theme : (state.theme || 'paper');
                if (state.isCompleted) {
                    state.elapsed = state.totalDuration;
                    state.accumulatedElapsed = state.totalDuration;
                    state.isPaused = true;
                }
                if (state.totalDuration > 0 && !state.isCompleted) state.isModeLocked = true;
                return true;
            }

            async function hydrateFromCloud() {
                if (!currentUser || !supabaseClient) return;
                const { data, error } = await supabaseClient
                    .from('logtime_state').select('state').eq('user_id', currentUser.id).maybeSingle();
                if (error) { console.warn('LogTime cloud state:', error.message); cloudHydrated = true; return; }
                if (data && data.state) {
                    applyState(data.state);
                    try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(data.state)); } catch (e) {}
                } else {
                    // 第一次登录：把当前设备已有状态迁移到云端
                    const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
                    if (raw) {
                        try { await saveCloudState(JSON.parse(raw)); } catch (e) {}
                    }
                }
                cloudHydrated = true;
                renderCurrentUIAfterHydration();
                await loadCloudHistory();
            }

            function renderCurrentUIAfterHydration() {
                if (state.totalDuration <= 0) {
                    dom.emptyState.classList.remove('hidden');
                    showMinimap(false);
                    updateMinimap(0, 0);
                    dom.resetCapsuleBtn.style.display = 'none';
                    updateTaskInfoDisplay();
                    return;
                }
                dom.emptyState.classList.add('hidden');
                showMinimap(true);
                if (state.isCompleted) {
                    updateMinimap(1, 1);
                    showDoneFlag();
                    renderAll(1, 1);
                    dom.resetCapsuleBtn.style.display = '';
                } else {
                    const x = state.totalDuration ? Math.min(state.elapsed / state.totalDuration, 1) : 0;
                    updateMinimap(x, calculatePerceivedProgress(x));
                    if (!state.isPaused) {
                        state.startTimestamp = Date.now();
                        startTimer();
                    }
                    updatePauseButton();
                    renderAll(x, calculatePerceivedProgress(x));
                }
                updateTaskInfoDisplay();
                updateRealTimeVisibility();
                updateModeSelector();
            }
            function loadState() {
                try {
                    const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
                    if (!raw) return false;
                    const d = JSON.parse(raw);
                    if (!d || typeof d !== 'object') return false;

                    state.taskName = d.taskName || '';
                    state.totalDuration = d.totalDuration || 0;
                    state.elapsed = d.elapsed || 0;
                    state.accumulatedElapsed = d.accumulatedElapsed || 0;
                    state.isPaused = d.isPaused !== undefined ? d.isPaused : true;
                    state.isCompleted = d.isCompleted || false;
                    state.mode = 'street';
                    state.showRealTime = d.showRealTime || false;
                    state.feedbackMode = d.feedbackMode || 'A';
                    state.isModeLocked = d.isModeLocked || false;
                    state.theme = (d.theme && THEMES[d.theme]) ? d.theme : 'paper';

                    if (state.isCompleted) {
                        state.elapsed = state.totalDuration;
                        state.accumulatedElapsed = state.totalDuration;
                        state.isPaused = true;
                    }

                    if (state.totalDuration > 0 && !state.isCompleted) {
                        state.isModeLocked = true;
                    }

                    return true;
                } catch (e) { return false; }
            }

            // ===== 重置 =====
            function resetTask() {
                document.querySelectorAll('.completion-burst').forEach(el => el.remove());
                if (burstTimeout) clearTimeout(burstTimeout);
                if (updateTimer) { clearInterval(updateTimer);
                    updateTimer = null; }

                state.taskName = '';
                state.totalDuration = 0;
                state.elapsed = 0;
                state.accumulatedElapsed = 0;
                state.isPaused = true;
                state.isCompleted = false;
                state.startTimestamp = null;
                state.pauseTimestamp = null;
                state.isModeLocked = false;

                try {
                    localStorage.removeItem(CONFIG.STORAGE_KEY);
                } catch (e) { /* ignore */ }

                dom.emptyState.classList.remove('hidden');
                showMinimap(false);
                updateMinimap(0, 0);
                hideDoneFlag();
                resetTaskInfoDisplay();
                dom.resetCapsuleBtn.style.display = 'none';
                dom.realTimeValue.textContent = '';
                dom.mainVisual.classList.remove('paused-state');
                updateBottomControls();
                dom.menuOverlay.classList.remove('open');
                closeAddPanel();
                if (isEditing) {
                    dom.taskNameInput.classList.add('hidden');
                    dom.taskNameDisplay.classList.remove('hidden');
                    isEditing = false;
                }
                forgetHeroRectSoon();
                saveState();
            }

            // ===== 账户 =====
            let authRegisterMode = false;

            function setAuthStatus(text, type) {
                dom.authStatus.textContent = text || '';
                dom.authStatus.className = 'auth-status' + (type ? ' auth-' + type : '');
            }

            function updateAuthUI() {
                if (currentUser) {
                    const al = dom.authBtn.querySelector('.auth-label');
                    if (al) al.textContent = (currentUser.email || '账户').split('@')[0];
                } else {
                    const al = dom.authBtn.querySelector('.auth-label');

                }
            }

            function openAuthModal() {
                dom.authModal.classList.add('open');

                    dom.authSub.textContent = '当前账户的数据会自动同步到云端。';
                    dom.authForm.classList.add('hidden');

                    dom.authAccountEmail.textContent = currentUser.email || '';
                    dom.authGuestCloseWrap.classList.add('hidden');
                } else {
                    dom.authTitle.textContent = authRegisterMode ? '注册 LogTime' : '登录 LogTime';
                    dom.authSub.textContent = '登录后，任务与历史记录会在设备间同步。';
                    dom.authForm.classList.remove('hidden');
                    dom.authAccountView.classList.add('hidden');
                    dom.authGuestCloseWrap.classList.remove('hidden');
                    dom.authSubmitBtn.textContent = authRegisterMode ? '注册' : '登录';
                    dom.authSwitchBtn.textContent = authRegisterMode ? '已有账户？登录' : '还没有账户？注册';
                }
                setAuthStatus('');
            }

            async function submitAuth() {
                if (authBusy) return;
                const email = dom.authEmail.value.trim();
                const password = dom.authPassword.value;
                if (!email || !email.includes('@')) { setAuthStatus('请输入有效邮箱。', 'error'); return; }
                if (password.length < 6) { setAuthStatus('密码至少需要 6 位。', 'error'); return; }
                if (!supabaseClient) {
                    setAuthStatus('云端服务未加载（网络或 CDN 问题），本地计时与历史记录不受影响。', 'error');
                    return;
                }
                authBusy = true;
                dom.authSubmitBtn.disabled = true;
                setAuthStatus(authRegisterMode ? '正在注册……' : '正在登录……');
                try {
                    if (authRegisterMode) {
                        const { data, error } = await supabaseClient.auth.signUp({
                            email, password,
                            options: { emailRedirectTo: window.location.origin + window.location.pathname }
                        });
                        if (error) throw error;
                        if (data.session) {
                            setAuthStatus('注册成功，正在同步。', 'success');
                        } else {
                            setAuthStatus('注册成功，请检查邮箱完成验证。', 'success');
                        }
                    } else {
                        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                        if (error) throw error;
                        setAuthStatus('登录成功。', 'success');
                    }
                } catch (e) {
                    setAuthStatus(e.message || '操作失败，请稍后重试。', 'error');
                } finally {
                    authBusy = false;
                    dom.authSubmitBtn.disabled = false;
                }
            }

            async function handleAuthSession(session) {
                const nextUserId = session?.user?.id || null;
                if (nextUserId && currentUser?.id === nextUserId && cloudHydrated) return;
                currentUser = session?.user || null;
                cloudHydrated = false;
                updateAuthUI();
                if (currentUser) {
                    await hydrateFromCloud();
                    dom.authModal.classList.remove('open');
                    dom.authEmail.value = '';
                    dom.authPassword.value = '';
                }
            }

            // ===== 初始化 =====
            function init() {
                const hasSaved = loadState();
                applyTheme(state.theme || 'paper');
                startStreetLoop();
                forgetHeroRectSoon();

                if (hasSaved && state.totalDuration > 0) {
                    dom.emptyState.classList.add('hidden');

                    if (state.isCompleted) {
                        showMinimap(true);
                        updateMinimap(1, 1);
                        showDoneFlag();
                        renderAll(1, 1);
                        updateTaskInfoDisplay();
                        dom.resetCapsuleBtn.style.display = '';
                        dom.mainVisual.classList.remove('paused-state');
                    } else {
                        showMinimap(true);
                        updateMinimap(
                            state.totalDuration > 0 ? Math.min(state.elapsed / state.totalDuration, 1) : 0,
                            0
                        );
                        if (!state.isPaused) {
                            state.startTimestamp = Date.now();
                            state.accumulatedElapsed = state.elapsed;
                            startTimer();
                        } else {
                            const x = state.totalDuration > 0 ? Math.min(state.elapsed / state.totalDuration, 1) : 0;
                            renderAll(x, calculatePerceivedProgress(x));
                            dom.mainVisual.classList.add('paused-state');
                        }
                        updateTaskInfoDisplay();
                        updatePauseButton();
                    }

                    updateModeBadge();
                    updateRealTimeVisibility();
                    state.isInitialized = true;
                    return;
                }

                dom.emptyState.classList.remove('hidden');
                showMinimap(false);
                updateMinimap(0, 0);
                resetTaskInfoDisplay();
                dom.resetCapsuleBtn.style.display = 'none';
                updateModeBadge();
                updateRealTimeVisibility();
                updateBottomControls();
                state.isInitialized = true;
            }
            // ===== 旋转时的位置连续化（FLIP）=====
            // 旋转会同时改变 100dvh 与安全区：横竖屏高度差近一倍，
            // 而主体（圆环 / 方格 / 空态按钮）是靠 flex 居中的，
            // 位置和尺寸会在一帧内跳一大段（横屏中心 y≈225，竖屏 y≈449），
            // 看起来就是"圆环从上跳到下"。
            // 用 FLIP 把它按"旋转前的位置与尺寸"用 transform 摆回去，再过渡到自然位置：
            // 只动 transform（GPU），不触发布局，符合 §12 的性能约束。
            let heroFlipTimer = null;
            let settledHeroRect = null;

            function heroEl() {
                if (dom.streetScene && !dom.streetScene.classList.contains('hidden')) return dom.streetScene;
                return dom.streetScene || null;
            }
            function rememberHeroRect() {
                syncVisualHeight();
                const el = heroEl();
                settledHeroRect = el ? el.getBoundingClientRect() : null;
            }
            function prefersReducedMotion() {
                return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
            }
            // 把主体区真正的可用高度量出来交给 CSS（--visual-h）。
            // 圆环与方格的尺寸都以它为上限：用 px 而不是百分比，
            // 因为百分比 max-height 在旋转后有时不重新解析，而且压高度不会带回宽度
            //（方格会被压扁、圆环会变椭圆）。宽度约束则能正确带动 aspect-ratio。
            function syncVisualHeight() {
                const v = dom.mainVisual;
                if (!v) return;
                const cs = getComputedStyle(v);
                const h = v.clientHeight - parseFloat(cs.paddingTop || 0) - parseFloat(cs.paddingBottom || 0);
                if (h > 0) document.documentElement.style.setProperty('--visual-h', Math.round(h) + 'px');
            }
            function flipHero(from) {
                const el = heroEl();
                if (!el || !from || !from.width) { rememberHeroRect(); return; }
                const to = el.getBoundingClientRect();
                if (!to.width) { rememberHeroRect(); return; }
                const dx = from.left - to.left;
                const dy = from.top - to.top;
                const sx = from.width / to.width;
                if (Math.abs(dx) < 2 && Math.abs(dy) < 2 && Math.abs(sx - 1) < 0.02) {
                    rememberHeroRect();
                    return;
                }
                if (prefersReducedMotion()) { rememberHeroRect(); return; }
                clearTimeout(heroFlipTimer);
                el.style.willChange = 'transform';
                el.style.transformOrigin = 'top left';
                el.style.transition = 'none';
                el.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + sx + ')';
                void el.offsetWidth;   // 起始状态必须先落到画面上，否则不会有过渡
                el.style.transition = 'transform var(--dur-modal) var(--ease-out)';
                el.style.transform = '';
                heroFlipTimer = setTimeout(function() {
                    el.style.transition = '';
                    el.style.transformOrigin = '';
                    el.style.willChange = '';
                    rememberHeroRect();
                }, 340);
            }
            // 页面不滚动，所以只在"布局真的变了"的时刻刷新缓存：
            // 初始化、切换显示方式、任务开始/重置、以及每次尺寸稳定之后。
            function forgetHeroRectSoon() {
                setTimeout(rememberHeroRect, 0);
            }

            // ===== 事件绑定 =====
            function bindEvents() {
                dom.authBtn.addEventListener('click', openAuthModal);
                dom.authSubmitBtn.addEventListener('click', submitAuth);
                dom.authSwitchBtn.addEventListener('click', function() {
                    authRegisterMode = !authRegisterMode;
                    openAuthModal();
                    dom.authPassword.value = '';
                });
                dom.authGuestCloseBtn.addEventListener('click', () => dom.authModal.classList.remove('open'));
                dom.authCloseBtn.addEventListener('click', () => dom.authModal.classList.remove('open'));
                dom.authSignOutBtn.addEventListener('click', async function() {
                    if (supabaseClient) await supabaseClient.auth.signOut();
                    dom.authModal.classList.remove('open');
                    cloudHydrated = false;
                    currentUser = null;
                    updateAuthUI();
                    setAuthStatus('');
                });
                dom.authModal.addEventListener('click', function(e) {
                    if (e.target === this) this.classList.remove('open');
                });
                dom.authPassword.addEventListener('keydown', function(e) {

                // ---- 任务名称编辑 ----

                document.addEventListener('mousedown', function(e) {

                    }
                });

                dom.taskNameInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();

                    }
                });

                // ---- 菜单 ----
                dom.menuBtn.addEventListener('click', function() {
                    dom.menuOverlay.classList.add('open');
                });
                dom.menuClose.addEventListener('click', function() {
                    dom.menuOverlay.classList.remove('open');
                });
                dom.menuOverlay.addEventListener('click', function(e) {
                    if (e.target === this) {
                        this.classList.remove('open');
                    }
                });
                // 菜单项是 div，键盘用户原本完全无法触达：补 role/tabindex，并用 Enter/Space 触发点击
                dom.menuOverlay.querySelectorAll('.menu-option').forEach(function(el) {
                    el.setAttribute('role', 'button');
                    el.setAttribute('tabindex', '0');
                });
                dom.menuOverlay.addEventListener('keydown', function(e) {
                    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Space') return;
                    const option = e.target && e.target.closest ? e.target.closest('.menu-option') : null;
                    if (!option) return;
                    e.preventDefault();
                    option.click();
                });

                // ---- 换个场景（主题选择器） ----
                dom.sceneSwitchBtn.addEventListener('click', function() {
                    updateThemePickerState();
                    dom.themeModal.classList.add('open');

                dom.themeCloseBtn.addEventListener('click', function() {
                    dom.themeModal.classList.remove('open');
                });
                dom.themeModal.addEventListener('click', function(e) {
                    const card = e.target && e.target.closest ? e.target.closest('.theme-card') : null;
                    if (card) {
                        applyTheme(card.getAttribute('data-key'));
                        dom.themeModal.classList.remove('open');

                });
                dom.themeModal.querySelectorAll('.theme-card').forEach(function(el) {
                    el.setAttribute('role', 'button');
                    el.setAttribute('tabindex', '0');

                dom.themeModal.addEventListener('keydown', function(e) {
                    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Space') return;
                    const card = e.target && e.target.closest ? e.target.closest('.theme-card') : null;
                    if (!card) return;
                    e.preventDefault();
                    applyTheme(card.getAttribute('data-key'));
                    dom.themeModal.classList.remove('open');

                // ---- 真实进度 toggle ----
                dom.realTimeToggle.addEventListener('click', function() {
                    state.showRealTime = !state.showRealTime;
                    updateRealTimeVisibility();
                    saveState();

                // ---- 暂停 ----

                // ---- 添加任务 ----

                dom.cancelAddBtn.addEventListener('click', closeAddPanel);

                    }
                });

                });

                // ---- 简洁信息弹窗 ----
                dom.infoBtn.addEventListener('click', function() {
                    // 打开时刷新一次高亮，保证和当前选中的模式一致
                    updateModeCards();
                    dom.infoModal.classList.add('open');
                });
                dom.infoCloseBtn.addEventListener('click', function() {
                    dom.infoModal.classList.remove('open');
                });
                dom.infoModal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        this.classList.remove('open');
                    }
                });

                // ---- 历史记录弹窗 ----
                dom.historyMenuBtn.addEventListener('click', function() {
                    dom.menuOverlay.classList.remove('open');
                    renderHistory();
                    dom.historyModal.classList.add('open');
                });
                dom.historyCloseBtn.addEventListener('click', function() {
                    dom.historyModal.classList.remove('open');
                });
                dom.historyModal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        this.classList.remove('open');
                    }
                });

                // ---- 图片生成 ----
                dom.captureMenuBtn.addEventListener('click', function() {
                    dom.menuOverlay.classList.remove('open');
                    generateCapture();
                });

                // ---- 重置任务 ----
                dom.resetTaskBtn.addEventListener('click', function() {
                    if (confirm('确定要重置当前任务吗？所有进度将丢失。')) {
                        resetTask();
                    }
                });

                // ---- 屏幕常亮：回到前台且仍在计时就重新申请 ----
                document.addEventListener('visibilitychange', function() {
                    if (document.visibilityState === 'visible') updateWakeLock();
                    else wakeLock = null;   // 系统在切后台时已自动释放
                });

                // ---- 窗口 resize / 横竖屏切换 ----
                // iOS 在旋转后有时会保留一个视觉视口偏移（即使页面已 lock 住不滚动），
                // 表现就是"页面上部显示不全"。这里在尺寸变化后把它归零，属于无害的兜底：
                // 页面本来就不该滚动，scrollTo(0,0) 在正常情况下是空操作。
                function settleViewport() {
                    if (window.scrollY || document.documentElement.scrollTop) window.scrollTo(0, 0);
                }

                // iOS 还有一类滚动是 body 固定也拦不住的：**键盘弹出**时
                // 浏览器为了把光标滚进可视区，会把整页顶上去（视觉视口被推走），
                // 表现就是"输入框一聚焦，整个界面往上跑、顶部被切掉"。
                // 这里在聚焦/失焦以及视觉视口变化后把滚动位置拉回 0。
                window.addEventListener('focusin', function() { setTimeout(settleViewport, 120); });
                window.addEventListener('focusout', function() { setTimeout(settleViewport, 120); });
                if (window.visualViewport) {
                    window.visualViewport.addEventListener('resize', function() { setTimeout(settleViewport, 60); });
                    window.visualViewport.addEventListener('scroll', function() { setTimeout(settleViewport, 60); });
                }
                // ---- 旋转时的位置连续化（FLIP）----
                let resizeTimer;
                let lastViewportShape = window.innerWidth + 'x' + window.innerHeight;
                function viewportTurned() {
                    // 宽高互换才算"转过了方向"，避免地址栏收放也触发 FLIP
                    const w = window.innerWidth, h = window.innerHeight;
                    const wasLandscape = parseInt(lastViewportShape.split('x')[0], 10) >
                        parseInt(lastViewportShape.split('x')[1], 10);
                    lastViewportShape = w + 'x' + h;
                    return wasLandscape !== (w > h);
                }
                window.addEventListener('resize', function() {
                    const before = settledHeroRect;
                    const turned = viewportTurned();
                    settleViewport();
                    // 方向变了：在下一帧（新布局已应用）做 FLIP，把那一跳抹平
                    if (turned) requestAnimationFrame(function() { flipHero(before); });
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(function() {
                        settleViewport();
                        updateStreet(0);
                        rememberHeroRect();                        rememberHeroRect();
                    }, 200);
                });
                // 旋转还会改变 100dvh 与安全区，多补几次让布局稳定下来
                window.addEventListener('orientationchange', function() {
                    const before = settledHeroRect;
                    settleViewport();
                    requestAnimationFrame(function() { flipHero(before); });
                    setTimeout(settleViewport, 150);
                    setTimeout(function() {
                        settleViewport();
                        if (state.totalDuration > 0) updateTime();
                        rememberHeroRect();
                    }, 400);
                });

                // ---- 键盘快捷键 ----
                document.addEventListener('keydown', function(e) {
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target
                        .contentEditable === 'true') return;
                    if (e.key === ' ' || e.key === 'Space') {
                        e.preventDefault();
                        if (state.totalDuration > 0) {
                            togglePause();
                        }
                    }
                    if (e.key === 'Escape') {
                        dom.menuOverlay.classList.remove('open');
                        dom.infoModal.classList.remove('open');
                        dom.historyModal.classList.remove('open');
                        dom.themeModal.classList.remove('open');
                        if (dom.addPanel.classList.contains('open')) {
                            closeAddPanel();
                        }
                    }
                });

                // ---- 点击外部关闭添加面板 ----
                document.addEventListener('click', function(e) {
                    if (dom.addPanel.classList.contains('open')) {
                        const panel = dom.addPanel;
                        const trigger = dom.emptyAddBtn;
                        if (!panel.contains(e.target) && !trigger.contains(e.target)) {
                            closeAddPanel();
                        }
                    }
                });
            }

            // ===== 启动 =====
            document.addEventListener('DOMContentLoaded', async function() {
                init();
                bindEvents();
                registerServiceWorker();
                fitCharacter();
                window.addEventListener('resize', fitCharacter);
                if (supabaseClient) {
                    supabaseClient.auth.onAuthStateChange(function(event, session) {
                        if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION' || event === 'TOKEN_REFRESHED') {
                            setTimeout(() => handleAuthSession(session), 0);
                        } else if (event === 'SIGNED_OUT') {
                            currentUser = null; cloudHydrated = false; updateAuthUI();
                        }
                    });
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (session) await handleAuthSession(session);
                } else {
                    // 本地模式：云端入口保持可见但点了会给出说明
                    updateAuthUI();
                }
                if (state.totalDuration <= 0) {
                    dom.emptyState.classList.remove('hidden');
                    showMinimap(false);
                    updateMinimap(0, 0);
                    dom.resetCapsuleBtn.style.display = 'none';
                }
                if (state.isCompleted) {
                    showMinimap(true);
                    updateMinimap(1, 1);
                    showDoneFlag();
                }
                updateModeBadge();
                updateModeSelector();
                console.log('LogTime 已启动');
            });

            window.__TIME = {
                state,
                calculatePerceivedProgress,
                togglePause,
                startNewTask,
                generateCapture,
                resetTask,
                enableTaskNameEdit,
                disableTaskNameEdit,
                renderHistory,
                getHistory,
                saveHistoryEntry,
                deleteHistoryItem,
            };

        })();
    </script>

</body>
</html>
