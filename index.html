    <!-- viewport-fit=cover 是必须的：
         不写它的话，iOS 会把页面限制在"安全区"内排版，横屏时刘海两侧那两条
         根本不属于布局视口，浏览器拿根元素的背景色去填 —— 深色模式下就是两条纯黑。
         position: fixed; inset: 0 的背景层只能在布局视口内绘制，永远够不到那里，
         所以靠调渐变是修不好的。加上它之后页面铺满整屏，
         再用 env(safe-area-inset-*) 让内容自己避开刘海。 -->

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--ink-soft) transparent;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--ink-soft);
            border: 2px solid var(--card);
        }
        ::selection {
            background: var(--accent-pale);
            color: var(--ink);
        }
        /* ===== iOS 锁死页面：绝不上下滚动 =====
           iOS Safari 有个已知行为：只写 overflow:hidden 是拦不住的 ——
           内容一旦超出视口，整页照样能被拖走（橡皮筋回弹），
           地址栏收放时还会推动视觉视口、把内容顶出屏幕。
           可靠解法：把 body 变成 position:fixed 铺满视口，
           文档本身就没有可滚动的高度，浏览器没有东西可滚。
           内层需要滚动的面板不受影响（它们自己是 overflow:auto）。 */
        html {
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            background-color: var(--sky-mid);
            /* iOS 横屏时不要自动放大字号 */
            -webkit-text-size-adjust: 100%;
        }
        body {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
            /* 去掉双击缩放与手势翻页，滚动手势不再落到文档上 */
            touch-action: manipulation;
            background: none;
            color: var(--ink);
            font-family: var(--font);
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        /* 页底衬一层淡色，保证任何角落没有割裂 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: linear-gradient(180deg, var(--sky-top), var(--sky-mid) 45%, var(--sky-bottom));
        }
        #app {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        #app.has-bottom-bar {
            --app-pad-b: 84px;
        }
        .hidden {
            display: none !important;
        }
        /* ===== 顶栏 ===== */

            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 26px;
            min-height: 58px;
            z-index: 30;
            background: none;
            pointer-events: none;
        }
        .top-bar > * {
            pointer-events: auto;
        }
        .task-info {
            flex: 1;
            min-width: 0;
            padding-right: 10px;
        }
        .task-info.is-empty {
            visibility: hidden;
        }
        .task-name-wrap {
            position: relative;
            margin-bottom: 2px;
        }
        .task-name-display {

            letter-spacing: 0.01em;
            line-height: 1.25;

            padding: 3px 6px;

            border: 2px solid transparent;
            background: transparent;
            width: 100%;
            font-family: var(--font);
            margin-left: -6px;
            cursor: text;
            user-select: text;
            -webkit-user-select: text;
            outline: none;
        }
        .task-name-display:hover {
            background: rgba(255, 255, 255, 0.55);
            border-color: var(--accent-pale);
        }
        .task-name-display.empty {
            color: var(--muted);

        }
        .task-name-input {
            font-size: 1.3rem;

            color: var(--ink);
            padding: 3px 6px;

            border: 2px solid var(--accent);
            background: var(--paper);
            width: 100%;
            font-family: var(--font);
            margin-left: -6px;
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-pale);
        }
        .task-duration {

        }

            flex-shrink: 0;

        }
        .icon-button {
            background: var(--card);
            border: 2px solid var(--border);
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;

            transition: transform var(--dur-press) var(--ease-out), box-shadow var(--dur-press) var(--ease-out);

        }

            display: block;
            image-rendering: pixelated;
        }
        .icon-button:hover {

            transition: transform var(--dur-press) var(--ease-out), box-shadow var(--dur-press) var(--ease-out);
            max-width: 130px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .auth-button:hover {
            background: var(--accent-pale);
        }
        .auth-button:active {

            box-shadow: 0 0 0 var(--shadow);
        }
        /* ===== 主体 ===== */
        .main-visual {
            flex: 1 1 0%;
            min-height: 0;
            position: relative;
            overflow: hidden;
        }
        /* ===== 街景场景 ===== */
        .street-scene {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        /* 贴图视差层：素材分层图 repeat-x 无缝平铺（sky 固定不滚动） */
        .sky {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center bottom;
        }
        .layer {
            position: absolute;
            left: 0;
            right: 0;
            /* 关键：缩的是**盒子**，不是背景图。
               JS 每帧都会重写 background-position（横向滚动用它），
               背景的纵向锚点会被覆盖成 0（= 顶部对齐）。只要图小于盒子，
               底部就会露白、地面浮起来 —— 上一版就是这么坏掉的。
               所以改成：盒子自己下移并变矮，背景仍然 100% 填满盒子。
               这样 JS 怎么改 background-position，纵向对齐都不受影响。 */
            top: calc((1 - var(--art-scale)) * 100%);
            bottom: auto;
            height: calc(var(--art-scale) * 100%);
            pointer-events: none;
            background-repeat: repeat-x;
            background-position: 0 0;
            background-size: auto 100%;
        }
        .layer-clouds { z-index: 1; }
        .layer-far    { z-index: 2; }
        .layer-mid    { z-index: 3; }
        .layer-near   { z-index: 4; }
        .layer-ground { z-index: 5; }
        /* ===== 角色（固定位置行走） ===== */
        .walker {
            position: absolute;
            left: 46%;
            /* 落脚点跟着美术一起缩：美术里那条路面带变矮了，偏移量必须同比例缩，
               否则人会浮在路面上方。 */
            bottom: calc(var(--road-h) * var(--art-scale) - 4px * var(--art-scale));
            /* 以「底边中点」为原点缩放：缩小时脚底不动、水平也不偏 */
            transform-origin: 50% 100%;
            transform: translateX(-50%) scale(var(--art-scale));
            z-index: 6;
            width: 34px;
            height: 56px;
        }
        .walker-shadow {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 26px;
            height: 6px;
            background: rgba(34, 49, 74, 0.35);
        }
        .sprite {
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 48px;
            animation: spriteBob var(--walk-dur, 0.55s) ease-in-out infinite;
        }
        @keyframes spriteBob {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-3px); }
        }
        .sprite .head {
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 13px;
            background: var(--cream);
            border: 2px solid var(--ink);
            z-index: 2;
        }
        .sprite .hair {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 6px;
            background: var(--ink-soft);
            border: 2px solid var(--ink);
            border-bottom: none;
            z-index: 3;
        }
        .sprite .headband {
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 4px;
            background: var(--yellow);
            border: 2px solid var(--ink);
            border-left: none;
            border-right: none;
            z-index: 4;
        }
        .sprite .headband::after {
            content: '';
            position: absolute;
            top: -1px;
            right: -7px;
            width: 5px;
            height: 4px;
            background: var(--yellow);
            border: 2px solid var(--ink);
        }
        .sprite .eye {
            position: absolute;
            top: 8px;
            right: 3px;
            width: 3px;
            height: 3px;
            background: var(--ink);
            z-index: 3;
        }
        .sprite .torso {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 17px;
            z-index: 2;
        }
        .sprite .jacket {
            position: absolute;
            inset: 0;
            background: var(--accent);
            border: 2px solid var(--ink);
        }
        .sprite .pink-trim {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--pink);
            border-top: 2px solid var(--ink);
        }
        .sprite .leg {
            position: absolute;
            top: 30px;
            width: 6px;
            height: 16px;
            background: var(--ink-soft);
            border: 2px solid var(--ink);
            border-top: none;
            transform-origin: top center;
            z-index: 1;
        }
        .sprite .leg.left { left: 9px; }
        .sprite .leg.right { left: 15px; }
        .sprite .arm {
            position: absolute;
            top: 16px;
            width: 5px;
            height: 12px;
            background: var(--accent);
            border: 2px solid var(--ink);
            border-top: none;
            transform-origin: top center;
            z-index: 3;
        }
        .sprite .arm.left { left: 4px; }
        .sprite .arm.right { right: 4px; }
        .sprite.walking .leg.left { animation: stepL var(--walk-dur, 0.55s) steps(2, end) infinite; }
        .sprite.walking .leg.right { animation: stepR var(--walk-dur, 0.55s) steps(2, end) infinite; }
        .sprite.walking .arm.left { animation: armL var(--walk-dur, 0.55s) steps(2, end) infinite; }
        .sprite.walking .arm.right { animation: armR var(--walk-dur, 0.55s) steps(2, end) infinite; }
        @keyframes stepL {
            0%, 100% { transform: rotate(24deg); }
            50% { transform: rotate(-24deg); }
        }
        @keyframes stepR {
            0%, 100% { transform: rotate(-24deg); }
            50% { transform: rotate(24deg); }
        }
        @keyframes armL {
            0%, 100% { transform: rotate(-22deg); }
            50% { transform: rotate(22deg); }
        }
        @keyframes armR {
            0%, 100% { transform: rotate(22deg); }
            50% { transform: rotate(-22deg); }
        }
        .sprite.stopped .leg,
        .sprite.stopped .arm {
            animation: none !important;
        }
        .sprite.stopped .leg.left { transform: rotate(6deg); }
        .sprite.stopped .leg.right { transform: rotate(-6deg); }
        /* ===== 主题载具角色：船 / 骆驼 / 飞机（代码绘制） ===== */
        .ride { display: none; }
        [data-theme="paper"] .sprite { display: none; }
        [data-theme="paper"] .ride-boat { display: block; }
        [data-theme="flatnight"] .sprite { display: none; }
        [data-theme="flatnight"] .ride-camel { display: block; }
        [data-theme="glass"] .sprite { display: none; }
        [data-theme="glass"] .ride-plane { display: block; }
        [data-theme="glass"] .walker { bottom: calc(var(--road-h) + 48%); }
        [data-theme="glass"] .walker-shadow { display: none; }
        [data-theme="paper"] .walker { left: 42%; }
        /* 停顿时所有载具动画静止 */
        .ride.stopped, .ride.stopped * { animation: none !important; }

        /* ---- 海洋 · 人坐小船 ---- */
        .ride-boat {
            position: absolute; bottom: 2px; left: 50%;
            width: 46px; height: 36px;
            animation: boatFloat var(--walk-dur, 0.55s) ease-in-out infinite;
        }
        @keyframes boatFloat {
            0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
            25%      { transform: translateX(-50%) translateY(-1px) rotate(-1.6deg); }
            75%      { transform: translateX(-50%) translateY(1px) rotate(1.6deg); }
        }
        .ride-boat .hull {
            position: absolute; bottom: 1px; left: 50%; transform: translateX(-50%);
            width: 42px; height: 12px;
            background: #c88a4a; border: 2px solid #6d4526;
            border-radius: 3px 3px 7px 7px;
        }
        .ride-boat .hull::before {
            content: ''; position: absolute; left: 4px; right: 4px; top: 3px; height: 2px;
            background: rgba(109, 69, 38, 0.55);
        }
        .ride-boat .hull::after {
            content: ''; position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
            width: 18px; height: 4px;
            background: #c88a4a; border: 2px solid #6d4526; border-bottom: none;
            border-radius: 3px 3px 0 0;
        }
        .ride-boat .rider { position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%); width: 18px; height: 22px; }
        .ride-boat .rhead {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 12px; height: 11px; background: #f4ead6; border: 2px solid #4a3820; border-radius: 50%;
        }
        .ride-boat .rtorso {
            position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
            width: 15px; height: 12px; background: #7fb8d8; border: 2px solid #4a3820; border-radius: 3px 3px 5px 5px;
        }
        .ride-boat .paddle {
            position: absolute; bottom: 8px; right: -1px; width: 4px; height: 18px;
            background: #8a5a2c; border: 2px solid #4a3820;
            transform-origin: 50% 100%;
            animation: paddleSwing var(--walk-dur, 0.55s) ease-in-out infinite;
        }
        @keyframes paddleSwing {
            0%, 100% { transform: rotate(26deg); }
            50%      { transform: rotate(-16deg); }
        }
        .ride-boat .paddle::before {
            content: ''; position: absolute; top: -7px; left: 50%; transform: translateX(-50%);
            width: 9px; height: 6px; background: #9c6a35; border: 2px solid #4a3820; border-radius: 0 0 4px 4px;
        }
        .ride-boat .wave { position: absolute; bottom: -3px; left: 0; right: 0; height: 5px; pointer-events: none; }
        .ride-boat .wave span {
            position: absolute; bottom: 0; width: 7px; height: 3px; border-radius: 50%;
            background: rgba(191, 224, 240, 0.85);
            animation: waveDrift var(--walk-dur, 0.55s) ease-in-out infinite;
        }
        .ride-boat .wave span:nth-child(1) { left: 2px; }
        .ride-boat .wave span:nth-child(2) { left: 16px; animation-delay: -0.18s; }
        .ride-boat .wave span:nth-child(3) { left: 30px; animation-delay: -0.36s; }
        @keyframes waveDrift {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(1.5px); }
        }

        /* ---- 沙漠 · 骑骆驼 ---- */
        .ride-camel {
            position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
            width: 48px; height: 40px;
        }
        .ride-camel .leg {
            position: absolute; bottom: 0; width: 5px; height: 13px;
            background: #a06a35; border: 2px solid #4a3420;
            transform-origin: top center;
        }
        .ride-camel .leg.l1 { left: 3px; }
        .ride-camel .leg.l2 { left: 14px; }
        .ride-camel .leg.l3 { left: 28px; }
        .ride-camel .leg.l4 { left: 39px; }
        .ride-camel.walking .leg.l1, .ride-camel.walking .leg.l4 { animation: camelStepA var(--walk-dur, 0.55s) ease-in-out infinite; }
        .ride-camel.walking .leg.l2, .ride-camel.walking .leg.l3 { animation: camelStepB var(--walk-dur, 0.55s) ease-in-out infinite; }
        @keyframes camelStepA { 0%, 100% { transform: rotate(18deg); } 50% { transform: rotate(-14deg); } }
        @keyframes camelStepB { 0%, 100% { transform: rotate(-14deg); } 50% { transform: rotate(18deg); } }
        .ride-camel .body {
            position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
            width: 40px; height: 12px;
            background: #d2a865; border: 2px solid #4a3420; border-radius: 9px 11px 7px 9px;
        }
        .ride-camel .hump {
            position: absolute; width: 13px; height: 10px;
            background: #d2a865; border: 2px solid #4a3420; border-radius: 7px 7px 2px 2px;
        }
        .ride-camel .hump.back { bottom: 20px; left: 7px; }
        .ride-camel .hump.front { bottom: 22px; left: 20px; }
        .ride-camel .neck {
            position: absolute; bottom: 16px; right: 1px;
            width: 6px; height: 15px;
            background: #d2a865; border: 2px solid #4a3420; border-radius: 4px;
            transform: rotate(14deg);
        }
        .ride-camel .head {
            position: absolute; bottom: 29px; right: -2px;
            width: 13px; height: 9px;
            background: #d2a865; border: 2px solid #4a3420; border-radius: 6px 7px 3px 4px;
        }
        .ride-camel .head::before {
            content: ''; position: absolute; top: -3px; left: 1px;
            width: 4px; height: 5px;
            background: #d2a865; border: 2px solid #4a3420; border-bottom: none; border-radius: 3px 3px 0 0;
        }
        .ride-camel .rider {
            position: absolute; bottom: 21px; left: 50%; transform: translateX(-50%);
            width: 18px; height: 20px;
        }
        .ride-camel .rhead {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 12px; height: 11px; background: #e8c18a; border: 2px solid #2c2140; border-radius: 50%;
        }
        .ride-camel .scarf {
            position: absolute; top: 1px; left: -1px; width: 16px; height: 4px;
            background: #f5c95b; border: 2px solid #2c2140; border-radius: 2px;
        }
        .ride-camel .rtorso {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            width: 15px; height: 11px; background: #2e3a66; border: 2px solid #2c2140; border-radius: 3px 3px 5px 5px;
        }

        /* ---- 城市 · 人坐飞机（天上） ---- */
        .ride-plane {
            position: absolute; bottom: 4px; left: 50%;
            width: 48px; height: 30px;
            animation: planeFly var(--walk-dur, 0.55s) ease-in-out infinite;
        }
        @keyframes planeFly {
            0%, 100% { transform: translateX(-50%) translateY(0) rotate(-1.2deg); }
            50%      { transform: translateX(-50%) translateY(-3px) rotate(1.2deg); }
        }
        .ride-plane .fuse {
            position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%);
            width: 36px; height: 11px;
            background: #a9bef0; border: 2px solid #2a2148; border-radius: 12px 14px 7px 9px;
        }
        .ride-plane .fuse::before {
            content: ''; position: absolute; top: 2px; left: 10px;
            width: 5px; height: 4px; background: #e8eefc; border: 1px solid #2a2148; border-radius: 50%;
        }
        .ride-plane .wing {
            position: absolute; bottom: 12px; left: 8px;
            width: 17px; height: 5px;
            background: #7d92c8; border: 2px solid #2a2148; border-radius: 3px 4px 2px 3px;
        }
        .ride-plane .tail {
            position: absolute; bottom: 15px; right: 2px;
            width: 4px; height: 9px;
            background: #a9bef0; border: 2px solid #2a2148; border-radius: 2px 2px 3px 3px;
        }
        .ride-plane .prop {
            position: absolute; bottom: 16px; left: 1px;
            width: 5px; height: 5px;
            background: #dfe8fa; border: 2px solid #2a2148; border-radius: 50%;
            animation: propSpin 0.28s linear infinite;
        }
        @keyframes propSpin { to { transform: rotate(360deg); } }
        .ride-plane .pilot {
            position: absolute; bottom: 19px; left: 50%; transform: translateX(-50%);
            width: 16px; height: 12px;
        }
        .ride-plane .rhead {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 12px; height: 11px; background: #f4ead6; border: 2px solid #2a2148; border-radius: 50%;
        }
        .ride-plane .goggles {
            position: absolute; top: 2px; left: 3px; right: 3px; height: 3px;
            background: #5f74b8; border: 1px solid #2a2148; border-radius: 2px;
        }
        .ride-plane .rtorso {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            width: 15px; height: 9px; background: #6b5aa8; border: 2px solid #2a2148; border-radius: 3px 3px 5px 5px;
        }
        /* 暂停时整体压暗 */
        .main-visual.paused-state .street-scene {
            filter: saturate(0.72) brightness(0.9);
        }
        /* ===== 空态 ===== */
        .empty-state {
            position: absolute;
            inset: 0;
            z-index: 8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .empty-state .add-trigger {
            pointer-events: auto;
            width: 64px;
            height: 64px;
            background: var(--card);
            border: 3px solid var(--border);
            border-radius: 6px;
            box-shadow: 0 5px 0 var(--shadow);
            color: var(--accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
            font-family: var(--font);
            transition: transform var(--dur-press) var(--ease-out), box-shadow var(--dur-press) var(--ease-out);
        }
        .empty-state .add-trigger svg {
            width: 30px;
            height: 30px;
        }
        .empty-state .add-trigger:hover {
            background: var(--card-deep);
        }
        .empty-state .add-trigger:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 var(--shadow);
        }
        .empty-state .empty-hint {
            font-size: 0.82rem;
            color: var(--ink);
            margin-top: 14px;
            font-weight: 700;
            background: var(--card);
            border: 2px solid var(--border);
            padding: 4px 10px;
            border-radius: 4px;
            box-shadow: 0 3px 0 var(--shadow);
        }
        .empty-state .scene-btn {
            position: absolute;
            bottom: 14px;
            right: 14px;
            pointer-events: auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font);
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--ink);
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 4px;
            padding: 7px 10px;
            box-shadow: 0 3px 0 var(--shadow);
            cursor: pointer;
            transition: transform var(--dur-press) var(--ease-out), box-shadow var(--dur-press) var(--ease-out);
        }
        .empty-state .scene-btn:hover { background: var(--card-deep); }
        .empty-state .scene-btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--shadow); }
        .empty-state .scene-btn svg { width: 14px; height: 14px; display: block; }
        @media (max-width: 380px) {
            .empty-state .scene-btn { bottom: 10px; right: 10px; padding: 6px 8px; }
        }
        /* ===== 完成提示 ===== */
        .done-flag {
            position: absolute;
            top: 14%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9;
            font-family: var(--font-pixel);
            font-size: 1.05rem;
            color: var(--ink);
            background: var(--yellow);
            border: 3px solid var(--border);
            padding: 8px 14px;
            border-radius: 4px;
            box-shadow: 0 5px 0 var(--shadow);
            animation: flagPop 0.3s steps(3, end) both;
        }
        @keyframes flagPop {
            0% { transform: translateX(-50%) scale(0.4); opacity: 0; }
            100% { transform: translateX(-50%) scale(1); opacity: 1; }
        }
        /* ===== 主题选择器（换个场景） ===== */
        .theme-picker .modal-content {
            max-width: 430px;
        }
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
            gap: 10px;
            margin-top: 14px;
        }
        .theme-grid .theme-card:last-child:nth-child(odd) {
            grid-column: 1 / -1;
            justify-self: center;
            width: 50%;
            min-width: 148px;
        }
        .theme-card {
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 8px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 4px;
            box-shadow: 0 3px 0 var(--shadow);
            cursor: pointer;
            text-align: left;
            font-family: var(--font);
            transition: transform var(--dur-press) var(--ease-out), box-shadow var(--dur-press) var(--ease-out);
        }
        .theme-card:hover { background: var(--card-deep); }
        .theme-card:active { transform: translateY(3px); box-shadow: 0 0 0 var(--shadow); }
        .theme-card.active { box-shadow: 0 3px 0 var(--shadow), 0 0 0 3px var(--accent); }
        .theme-swatch {
            height: 54px;
            border: 2px solid var(--border);
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }
        .theme-swatch::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 34%;
            background: var(--swatch-buildings);
        }
        .theme-name {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .theme-name .tag {
            font-family: var(--font-pixel);
            font-size: 0.62rem;
            color: var(--muted);
        }
        .theme-card[data-key="paper"] .theme-swatch {
            background: linear-gradient(180deg, #d6ecfd, #bcdbf7 55%, #a0c9ef);
            --swatch-buildings: linear-gradient(180deg, #8fa3ba, #a8b6c6);
        }
        .theme-card[data-key="chunky"] .theme-swatch {
            background: linear-gradient(180deg, #b7e6fa, #93d0f5 55%, #6fb8e9);
            --swatch-buildings: linear-gradient(180deg, #7d9cc4, #90aed8);
        }
        .theme-card[data-key="flatnight"] .theme-swatch {
            background: linear-gradient(180deg, #0b1030, #172052 55%, #2a3570);
            --swatch-buildings: linear-gradient(180deg, #232e5a, #1b2448);
        }
        .theme-card[data-key="glass"] .theme-swatch {
            background: linear-gradient(180deg, #0e0a2e, #1e1448 55%, #3d1e5e);
            --swatch-buildings: linear-gradient(180deg, #352a66, #241a44);
        }
        /* ===== 小地图（右上角，映射进度） ===== */
        .minimap {
            display: inline-flex;
            align-items: center;
            margin-top: 8px;
            padding: 0;
            width: 150px;
            background: transparent;
            border: none;
            border-radius: 0;
            box-shadow: none;
            box-sizing: border-box;
        }
        .minimap .mini-bar {
            position: relative;
            width: 100%;
            height: 14px;
            background: var(--mini-bg);
            border: 2px solid var(--mini-border);
            border-radius: 3px;
            box-shadow: inset 0 2px 0 rgba(0, 0, 0, 0.22);
            overflow: hidden;
            box-sizing: border-box;
        }
        .minimap .mini-fill {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 0%;
            background: var(--pink);
            background-image: repeating-linear-gradient(90deg, transparent 0 5px, rgba(255, 255, 255, 0.28) 5px 7px);
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.3);
            transition: width 0.18s steps(3, end);
        }
        .minimap .mini-fill.done {
            background: var(--yellow);
            background-image: repeating-linear-gradient(90deg, transparent 0 5px, rgba(255, 255, 255, 0.3) 5px 7px);
        }
        /* ===== 底部工具栏 ===== */
        .bottom-controls {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            padding-left: calc(16px + env(safe-area-inset-left, 0px));
            padding-right: calc(16px + env(safe-area-inset-right, 0px));
            padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            /* 这里原本有一条全宽的深色渐变（transparent → rgba(10,9,18,.85)）。
               任务开始后底部工具栏从 bar-hidden 变为可见，这条渐变就在页面下方
               铺出一块黑色蒙版。里面的按钮各自有底色和投影，不依赖这层遮罩，
               所以直接去掉。 */
            background: none;
            pointer-events: none;
            transition: opacity var(--dur-modal) var(--ease-out), transform var(--dur-modal) var(--ease-out);
        }
        .bottom-left,
        .bottom-right {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .bottom-right {
            margin-left: auto;
        }
        .bottom-controls.bar-hidden {
            opacity: 0;
            visibility: hidden;
            transform: translateY(100%);
            transition: opacity var(--dur-press) var(--ease), transform var(--dur-press) var(--ease-out);
        }
        /* 当前模型徽标 */
        .mode-badge-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 4px;
            padding: 5px 9px;
            cursor: default;
            box-shadow: 0 3px 0 var(--shadow);
            margin-right: 10px;
            gap: 7px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 4px;
            padding: 7px 11px;
            box-shadow: 0 3px 0 var(--shadow);
            cursor: pointer;

            .minimap { width: 96px; padding: 6px 8px; }
            :root {
                --app-pad-x: 14px;
                --app-pad-t: 12px;
                --app-pad-b: 20px;
            }
            .task-name-display,
            .task-name-input {
                font-size: 1.12rem;
            }
            .street-scene {
                border-width: 2px;
            }
            .minimap {
                width: 96px;
                padding: 5px 6px 4px;
            }
            .minimap .mini-svg {
                height: 28px;
            }
            .add-panel {
                padding: 16px 14px;
            }
            .add-row {
                flex-direction: column;
                gap: 10px;
            }
            .add-row .add-field {
                flex: 1;
                width: 100%;
            }
            .menu-panel {
                min-width: 182px;
                padding: 12px 12px 10px;
            }
            .modal-content {
                padding: 22px 18px 18px;
                margin: 8px;
            }
        }
        @media (max-width: 380px) {
            :root {
                --app-pad-x: 12px;
                --app-pad-t: 10px;
                --app-pad-b: 16px;
            }
            .task-name-display,
            .task-name-input {
                font-size: 1rem;
            }
            .mode-badge-btn .badge-name {
                font-size: 0.76rem;
            }
        }
        /* 宽屏（桌面/横屏）：街景尽量布满，页面仍固定不可滚动 */
        @media (min-width: 900px) {
            :root {
                --app-max: min(94vw, 1280px);
                --app-pad-t: 28px;
                --app-pad-x: 24px;
                --app-pad-b: 32px;
            }
            .task-name-display,
            .task-name-input {
                font-size: 1.45rem;
            }
        }
        /* 矮屏幕（手机横屏） */
        @media (max-height: 560px) {
            :root {
                --app-pad-t: 8px;
                --app-pad-b: 10px;
            }
            #app.has-bottom-bar {
                --app-pad-b: 66px;
            }
            .top-bar {
                min-height: 42px;
                padding: 2px 2px 6px;
            }
            .task-name-display,
            .task-name-input {
                font-size: 1rem;
                min-height: 1.8rem;
            }
            .street-scene {
                border-width: 2px;
            }
            .add-panel {
                padding: 12px 14px;
            }
            .minimap {
                width: 88px;
                padding: 4px 5px 3px;
            }
            .minimap .mini-svg {
                height: 24px;
            }
        }
        /* 减弱动效：去掉位移类动画，保留淡入淡出与颜色过渡 */
        @media (prefers-reduced-motion: reduce) {
            .add-panel,
            .menu-panel,
            .modal-content,
            .done-flag {
                animation: none !important;
            }
            .sprite,
            .sprite .leg,
            .sprite .arm {
                animation: none !important;
            }
            .sprite.stopped .leg { transform: none !important; }
            .completion-burst,
            .burst-piece {
                display: none !important;
            }
            .save-toast,
            .real-time-display,
            .bottom-controls.bar-hidden {
                transform: none !important;
            }
            .empty-state .add-trigger,
            .reset-capsule,
            .icon-button,
            .add-actions .btn,
            .auth-submit,
            .mode-badge-btn {
                transition: background var(--dur-press) var(--ease), color var(--dur-press) var(--ease), border-color var(--dur-press) var(--ease) !important;
            }
            .empty-state .add-trigger:active,
            .reset-capsule:active,
            .icon-button:active,
            .add-actions .btn:active,
            .auth-submit:active,
            .mode-badge-btn:active {
                transform: none !important;
                box-shadow: 0 3px 0 var(--shadow) !important;
            }
            .layer {
                transition: none !important;
            }
        }

    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header class="top-bar">
            <div class="task-info is-empty" id="taskInfo">
                <div class="task-name-wrap" id="taskNameWrap">
                    <div id="taskNameDisplay" class="task-name-display empty"></div>
                    <input type="text" id="taskNameInput" class="task-name-input hidden" maxlength="60" />
                </div>
                <div id="taskDurationDisplay" class="task-duration"></div>
                <div class="minimap hidden" id="minimap">
                    <div class="mini-bar"><div class="mini-fill" id="miniFill"></div></div>
                </div>
            </div>
            <div class="top-menu">
                <div class="real-time-wrap">
                    <button class="real-time-toggle" id="realTimeToggle" aria-label="实际进度">
                        <svg class="toggle-icon" viewBox="0 0 16 16" aria-hidden="true"><g fill="currentColor"><rect x="3" y="3" width="10" height="10"/><rect x="7" y="5" width="2" height="3"/><rect x="7" y="8" width="4" height="2"/></g></svg>
                    </button>
                    <div id="realTimeDisplay" class="real-time-display">
                        <span class="value" id="realTimeValue"></span>
                    </div>
                </div>
                <button class="icon-button" id="infoBtn" aria-label="关于 LogTime">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><g fill="currentColor"><rect x="7" y="2" width="2" height="2"/><rect x="6" y="6" width="4" height="8"/></g></svg>
                </button>
                <button class="icon-button" id="menuBtn" aria-label="菜单">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><g fill="currentColor"><rect x="2" y="3" width="12" height="2"/><rect x="2" y="7" width="12" height="2"/><rect x="2" y="11" width="12" height="2"/></g></svg>
                </button>
            </div>
        </header>

        <div class="add-mask" id="addMask"></div>
        <div id="addPanel" class="add-panel">
            <div class="panel-title">+ 添加任务</div>
            <div class="add-field">
                <label for="taskNameInputField">任务名称</label>
                <input type="text" id="taskNameInputField" placeholder="阶段复习，还是别的什么呢？" maxlength="60" />
            </div>
            <div class="add-row">
                <div class="add-field">
                    <label for="durationInput">时长</label>
                    <input type="number" id="durationInput" placeholder="例如：2" min="0.5" step="0.5" value="1" />
                </div>
                <div class="add-field">
                    <label for="unitSelect">单位</label>
                    <select id="unitSelect">
                        <option value="minutes">分钟</option>
                        <option value="hours" selected>小时</option>
                        <option value="days">天</option>
                        <option value="weeks">周</option>
                    </select>
                </div>
            </div>

            <!-- ===== 模式选择：启程 / 抵达 / Linear ===== -->
            <div class="mode-selection" id="modeSelection">
                <div class="mode-label">时间反馈模式</div>
                <label class="mode-option">
                    <input type="radio" name="mode" value="A" checked />
                    <span class="mode-name">启程</span>
                </label>
                <label class="mode-option">
                    <input type="radio" name="mode" value="B" />
                    <span class="mode-name">抵达</span>
                </label>
                <label class="mode-option">
                    <input type="radio" name="mode" value="C" />
                    <span class="mode-name">恒行</span>
                </label>
            </div>

            <div class="add-actions">
                <button class="btn" id="cancelAddBtn">取消</button>
                <button class="btn btn-primary" id="startNowBtn">现在开始</button>
            </div>
        </div>

        <div class="main-visual" id="mainVisual">
            <!-- 街景场景：小人固定行走，世界从左向右经过 -->
            <div class="street-scene" id="streetScene">
                <div class="sky" id="skyLayer"></div>
                <div class="layer layer-clouds" id="layerClouds"></div>
                <div class="layer layer-far" id="layerFar"></div>
                <div class="layer layer-mid" id="layerMid"></div>
                <div class="layer layer-near" id="layerNear"></div>
                <div class="layer layer-ground" id="layerGround"></div>

                <!-- 角色（固定在画面中） -->
                <div class="walker" id="walker">
                    <div class="walker-shadow"></div>
                    <div class="sprite stopped" id="walkerSprite">
                        <div class="hair"></div>
                        <div class="headband"></div>
                        <div class="head"></div>
                        <div class="eye"></div>
                        <div class="torso">
                            <div class="jacket"></div>
                            <div class="pink-trim"></div>
                        </div>
                        <div class="arm left"></div>
                        <div class="arm right"></div>
                        <div class="leg left"></div>
                        <div class="leg right"></div>
                    </div>
                    <!-- 主题载具：船（海洋）/ 骆驼（沙漠）/ 飞机（城市） -->
                    <div class="ride ride-boat stopped">
                        <div class="hull"></div>
                        <div class="rider"><div class="rhead"></div><div class="rtorso"></div></div>
                        <div class="paddle"></div>
                        <div class="wave"><span></span><span></span><span></span></div>
                    </div>
                    <div class="ride ride-camel stopped">
                        <div class="leg l1"></div><div class="leg l2"></div><div class="leg l3"></div><div class="leg l4"></div>
                        <div class="body"></div>
                        <div class="hump back"></div><div class="hump front"></div>
                        <div class="neck"></div><div class="head"></div>
                        <div class="rider"><div class="rhead"></div><div class="scarf"></div><div class="rtorso"></div></div>
                    </div>
                    <div class="ride ride-plane stopped">
                        <div class="fuse"></div>
                        <div class="wing"></div>
                        <div class="tail"></div>
                        <div class="prop"></div>
                        <div class="pilot"><div class="rhead"></div><div class="goggles"></div><div class="rtorso"></div></div>
                    </div>
                </div>

                <!-- 完成提示 -->
                <div class="done-flag hidden" id="doneFlag">完成！</div>

                <!-- 空态 -->
                <div id="emptyState" class="empty-state">
                    <button class="add-trigger" id="emptyAddBtn" aria-label="添加任务">
                        <svg viewBox="0 0 16 16" aria-hidden="true"><g fill="currentColor"><rect x="6" y="2" width="4" height="12"/><rect x="2" y="6" width="12" height="4"/></g></svg>
                    </button>
                    <span class="empty-hint">添加任务</span>
                    <button class="scene-btn" id="sceneSwitchBtn" aria-label="换个场景">
                        <svg viewBox="0 0 16 16" aria-hidden="true"><g fill="currentColor"><rect x="2" y="2" width="4" height="4"/><rect x="10" y="2" width="4" height="4"/><rect x="2" y="10" width="4" height="4"/><rect x="10" y="10" width="4" height="4"/><rect x="6" y="6" width="4" height="4"/></g></svg> 换个场景
                    </button>
                </div>
            </div>
        </div>    </div>

    <!-- 底部工具栏放在 #app 之外：它是通栏的界面 chrome，
         而 #app 在弹窗打开时会被整体"推后"（transform），
         若留在里面，transform 会成为 fixed 的包含块，通栏就失效了 -->
    <div class="bottom-controls">
        <div class="bottom-right">
            <button class="reset-capsule" id="resetCapsuleBtn" style="display:none">重置</button>
        </div>
    </div>

    <div class="menu-overlay" id="menuOverlay">
        <div class="menu-panel">
            <button class="menu-close" id="menuClose" aria-label="关闭">
                <svg viewBox="0 0 16 16" aria-hidden="true"><g fill="currentColor"><rect x="3" y="3" width="3" height="3"/><rect x="10" y="3" width="3" height="3"/><rect x="3" y="10" width="3" height="3"/><rect x="10" y="10" width="3" height="3"/><rect x="6" y="6" width="1" height="1"/><rect x="7" y="7" width="1" height="1"/><rect x="8" y="8" width="1" height="1"/><rect x="9" y="9" width="1" height="1"/><rect x="6" y="9" width="1" height="1"/><rect x="7" y="8" width="1" height="1"/><rect x="8" y="7" width="1" height="1"/><rect x="9" y="6" width="1" height="1"/></g></svg>
            </button>
            <div class="menu-about">
                <div class="menu-option" id="authBtn" style="margin-top:2px;">
                    <span class="menu-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><g fill="currentColor"><rect x="5" y="2" width="6" height="6"/><rect x="3" y="9" width="10" height="5"/><rect x="6" y="9" width="4" height="2"/></g></svg></span>
                    <span class="auth-label">登录</span>
                </div>
                <div class="menu-option" id="captureMenuBtn" style="margin-top:2px;">
                    <span class="menu-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><g fill="currentColor"><rect x="3" y="5" width="10" height="7"/><rect x="4" y="4" width="3" height="2"/><rect x="1" y="6" width="2" height="1"/><rect x="13" y="6" width="2" height="1"/><rect x="6" y="7" width="4" height="3"/></g></svg></span> 生成图片
                </div>
                <div class="menu-option" id="historyMenuBtn" style="margin-top:2px;">
                    <span class="menu-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><g fill="currentColor"><rect x="3" y="3" width="10" height="10"/><rect x="2" y="2" width="12" height="12" opacity="0.35"/><rect x="7" y="5" width="2" height="4"/><rect x="7" y="7" width="5" height="2"/></g></svg></span> 历史记录
                </div>
                <div class="menu-option danger" id="resetTaskBtn" style="margin-top:6px;padding-top:9px;border-top:2px dashed var(--ink-soft);">
                    <span class="menu-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><g fill="currentColor"><rect x="8" y="2" width="5" height="2"/><rect x="11" y="4" width="2" height="3"/><rect x="3" y="6" width="8" height="2"/><rect x="3" y="8" width="2" height="4"/><rect x="5" y="11" width="6" height="2"/></g></svg></span> 重置任务
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 主题选择器（换个场景） ===== -->
    <div class="modal-overlay theme-picker" id="themeModal">
        <div class="modal-content">
            <div class="modal-title">换个场景</div>
            <div class="modal-sub">选择街景的画风，随时可换</div>
            <div class="theme-grid">
                <button class="theme-card" data-key="paper" aria-label="纸张清昼">
                    <div class="theme-swatch"></div>
                    <span class="theme-name">纸张清昼 · 海洋 <span class="tag">PAPER</span></span>
                </button>
                <button class="theme-card" data-key="chunky" aria-label="软糖暖昼">
                    <div class="theme-swatch"></div>
                    <span class="theme-name">软糖暖昼 · 森林 <span class="tag">CHUNKY</span></span>
                </button>
                <button class="theme-card" data-key="flatnight" aria-label="扁平星夜">
                    <div class="theme-swatch"></div>
                    <span class="theme-name">扁平星夜 · 沙漠 <span class="tag">NIGHT</span></span>
                </button>
                <button class="theme-card" data-key="glass" aria-label="玻璃暮夜">
                    <div class="theme-swatch"></div>
                    <span class="theme-name">玻璃暮夜 · 城市 <span class="tag">GLASS</span></span>
                </button>
            </div>
            <div class="modal-close">
                <button id="themeCloseBtn">关闭</button>
            </div>
        </div>
    </div>

    <!-- ===== 简洁版合并弹窗 ===== -->
    <div class="modal-overlay" id="infoModal">
        <div class="modal-content">
            <div class="about-hero">
                <div class="modal-title">LogTime</div>
                <div class="modal-sub">三种时间模型</div>
            </div>

            <div class="mode-cards">
                <div class="mode-card" data-feedback-mode="A">
                    <div class="mode-card-header">
                        <span class="mode-name">启程</span>
                        <span class="mode-badge">A</span>
                    </div>
                </div>

                <div class="mode-card" data-feedback-mode="B">
                    <div class="mode-card-header">
                        <span class="mode-name">抵达</span>
                        <span class="mode-badge">B</span>
                    </div>
                </div>

                <div class="mode-card" data-feedback-mode="C">
                    <div class="mode-card-header">
                        <span class="mode-name">恒行</span>
                        <span class="mode-badge">C</span>
                    </div>
                </div>
            </div>

            <div class="modal-version">v2.5.3</div>

            <div class="modal-close">
                <button id="infoCloseBtn">关闭</button>
            </div>
        </div>
    </div>

    <!-- ===== 历史记录弹窗 ===== -->
    <div class="modal-overlay history-modal" id="historyModal">
        <div class="modal-content">
            <div class="modal-title">历史记录</div>
            <div class="modal-sub">已完成任务（≥ 1 分钟）</div>
            <div class="history-list" id="historyList">
                <!-- 由 JavaScript 动态渲染 -->
            </div>
            <div class="modal-close">
                <button id="historyCloseBtn">关闭</button>
            </div>
        </div>
    </div>


    <!-- ===== 账户弹窗 ===== -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-content">
            <div class="modal-title" id="authTitle">登录 LogTime</div>
            <div class="modal-sub" id="authSub">登录后，任务与历史记录会在设备间同步。</div>
            <div class="auth-form" id="authForm">
                <input type="email" id="authEmail" autocomplete="email" placeholder="邮箱" maxlength="254">
                <input type="password" id="authPassword" autocomplete="current-password" placeholder="密码（至少 6 位）" minlength="6" maxlength="72">
                <button class="auth-submit" id="authSubmitBtn">登录</button>
                <button class="auth-switch" id="authSwitchBtn">还没有账户？注册</button>
                <div class="auth-status" id="authStatus"></div>
            </div>
            <div class="auth-form hidden" id="authAccountView">
                <div class="auth-account">
                    <div class="auth-account-email" id="authAccountEmail"></div>
                    <div class="auth-account-sub">云端同步已开启</div>
                </div>
                <button class="auth-submit" id="authSignOutBtn" style="background:none;color:var(--text-light);border-color:var(--border);">退出登录</button>
                <button class="auth-switch" id="authCloseBtn">关闭</button>
            </div>
            <div class="modal-close" id="authGuestCloseWrap"><button id="authGuestCloseBtn">稍后再说</button></div>
        </div>
    </div>

    <!-- ===== 完成提示（右下角） ===== -->
    <div id="saveToast" class="save-toast"><svg viewBox="0 0 16 16" aria-hidden="true"><g fill="currentColor"><rect x="3" y="8" width="2" height="2"/><rect x="5" y="10" width="2" height="2"/><rect x="7" y="12" width="2" height="2"/><rect x="9" y="10" width="2" height="2"/><rect x="11" y="7" width="2" height="3"/></g></svg>已保存</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js">
